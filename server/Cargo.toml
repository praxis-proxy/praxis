[package]
name = "praxis-proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Cloud-native proxy server"
license.workspace = true
repository.workspace = true
readme = "../README.md"

[lib]
name = "praxis"
path = "src/lib.rs"

[[bin]]
name = "praxis"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { workspace = true }
notify = { workspace = true }
praxis-core = { workspace = true }
praxis-filter = { workspace = true }
praxis-protocol = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "fs"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }
tikv-jemallocator = { workspace = true }

[build-dependencies]
cargo_metadata = "0.23.1"

[dev-dependencies]
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = ["rustls"]
rustls = ["praxis-core/rustls", "praxis-filter/rustls", "praxis-protocol/rustls"]
openssl = ["praxis-core/openssl", "praxis-filter/openssl", "praxis-protocol/openssl"]
dev = ["basic-auth-filter"]
basic-auth-filter = ["praxis-filter/basic-auth-filter", "experimental"]
policy-engine = ["praxis-filter/policy-engine"]
# Marker feature activated transitively by any experimental feature.
# Used to gate the startup warning in startup_checks::warn_experimental_features.
experimental = []
otel = ["praxis-core/otel"]
