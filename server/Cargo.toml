[package]
name = "praxis-proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Cloud and AI-native proxy server"
license.workspace = true
repository.workspace = true
readme = "../README.md"

[lib]
name = "praxis"
path = "src/lib.rs"

[[bin]]
name = "praxis"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { workspace = true }
notify = { workspace = true }
praxis-core = { workspace = true }
praxis-filter = { workspace = true }
praxis-http-callout = { workspace = true, optional = true }
praxis-protocol = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "fs"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }
tikv-jemallocator = { workspace = true }

[build-dependencies]
cargo_metadata = "0.23.1"

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = ["ai-inference", "http-callout"]
ai-inference = ["praxis-filter/ai-inference", "praxis-protocol/response-store"]
ext-proc = ["praxis-filter/ext-proc"]
cpex-policy-engine = ["praxis-filter/cpex-policy-engine"]
http-callout = ["dep:praxis-http-callout", "praxis-core/callout"]

[package.metadata.cargo-machete]
ignored = ["praxis-http-callout"]  # consumed via build.rs auto-discovery codegen
