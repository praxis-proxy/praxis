[package]
name = "praxis-tests-integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
publish = false

[features]
# TLS and HTTPS active probes. Off by default.
tls-health-check = ["praxis/tls-health-check"]
# Matches the binary's default so a single-test run exercises the
# configuration the standard build ships. `--no-default-features` builds the
# proxy under test with the FIPS build's feature set instead
# (`make test-integration-fips`).
default = ["pingora", "policy-builtins"]
# The network backend of the proxy under test; exactly one. `make
# test-integration-hyper` builds with `--no-default-features --features hyper`.
pingora = ["praxis-test-utils/pingora", "praxis/pingora"]
hyper = ["praxis-test-utils/hyper", "praxis/hyper"]
# Policy selections, forwarded to the in-process proxy and to the harness so a
# subprocess proxy it builds carries the same selection.
policy-engine = ["praxis/policy-engine", "praxis-filter/policy-engine", "praxis-test-utils/policy-engine"]
policy-builtins = [
    "policy-engine",
    "policy-experimental-ratelimit",
    "praxis/policy-builtins",
    "praxis-test-utils/policy-builtins",
]
policy-crypto-default = ["policy-engine", "praxis/policy-crypto-default", "praxis-test-utils/policy-crypto-default"]
policy-crypto-fips = ["policy-engine", "praxis/policy-crypto-fips", "praxis-test-utils/policy-crypto-fips"]
policy-api-key = ["policy-engine", "praxis/policy-api-key", "praxis-test-utils/policy-api-key"]
policy-api-key-fips = ["policy-api-key", "policy-crypto-fips"]
policy-jwt = ["policy-engine", "praxis/policy-jwt", "praxis-test-utils/policy-jwt"]
policy-jwt-openssl-fips = [
    "policy-engine",
    "praxis/policy-jwt-openssl-fips",
    "praxis-test-utils/policy-jwt-openssl-fips",
]
policy-jwt-fips = ["policy-jwt-openssl-fips", "policy-crypto-fips"]
policy-experimental-ratelimit = [
    "policy-engine",
    "praxis/policy-experimental-ratelimit",
    "praxis-test-utils/policy-experimental-ratelimit",
]
basic-auth-filter = ["praxis-filter/basic-auth-filter"]
cloud-events-filter = ["praxis/cloud-events-filter"]
upstream-binding = ["praxis/upstream-binding"]
iterative-request-router = ["praxis/iterative-request-router"]
slow-start = ["praxis/slow-start"]
bound-upstream-request-body = ["praxis/bound-upstream-request-body"]
# Off by default; runs the SPIFFE mTLS e2e tests against a proxy built with it.
spiffe = ["praxis/spiffe"]
# Off by default; runs the access_log syslog-sink example test against a proxy built with it.
access-log-syslog = ["praxis/access-log-syslog"]
# Off by default; races hedged requests in the example test.
hedged-requests = ["praxis/hedged-requests"]
# Off by default; paces `bandwidth_limit` on HTTP, TCP, and sub-requests.
bandwidth = ["praxis/bandwidth"]
no-mac-cert-rotation-tests = []
otel = ["praxis/otel"]

[lints]
workspace = true

[dev-dependencies]
arc-swap = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
h2 = { workspace = true }
http = { workspace = true }
# The policy example tests mint HS256 JWTs through the system OpenSSL
# (examples/jwt.rs) rather than jsonwebtoken, whose aws-lc-rs would otherwise
# sit in the FIPS test build's graph.
openssl = { workspace = true }
# Used by TLS target tests and compression codec round-trip tests.
pingora-core = { workspace = true }
praxis = { workspace = true }
praxis-core = { workspace = true, features = ["test-support"] }
praxis-filter = { workspace = true }
praxis-protocol = { workspace = true, features = ["test-support"] }
praxis-test-utils = { workspace = true }
praxis-tls = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }
tokio-rustls = { workspace = true }
tokio-stream = { workspace = true }
tokio-tungstenite = { workspace = true }
opentelemetry-proto = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
opentelemetry = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
