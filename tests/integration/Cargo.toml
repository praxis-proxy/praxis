[package]
name = "praxis-tests-integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "../../README.md"
publish = false

[features]
# Matches the praxis-filter default so a single-test run exercises the
# configuration the default build ships.
default = ["policy-engine"]
policy-engine = ["praxis-filter/policy-engine"]
basic-auth-filter = ["praxis-filter/basic-auth-filter"]
cloud-events-filter = ["praxis/cloud-events-filter"]
iterative-request-router = ["praxis/iterative-request-router"]
# Off by default; runs the SPIFFE mTLS e2e tests against a proxy built with it.
spiffe = ["praxis/spiffe"]
no-mac-cert-rotation-tests = []
otel = ["praxis/otel"]

[lints]
workspace = true

[dev-dependencies]
arc-swap = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
h2 = { workspace = true }
http = { workspace = true }
# Used only by the policy example test to mint HS256 JWTs for the
# happy-path case (matches the filter crate's signing dependency).
jsonwebtoken = { workspace = true }
# Used by TLS target tests and compression codec round-trip tests.
pingora-core = { workspace = true }
praxis = { workspace = true }
praxis-core = { workspace = true }
praxis-filter = { workspace = true }
praxis-protocol = { workspace = true }
praxis-test-utils = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }
tokio-rustls = { workspace = true }
tokio-stream = { workspace = true }
tokio-tungstenite = { workspace = true }
opentelemetry-proto = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
