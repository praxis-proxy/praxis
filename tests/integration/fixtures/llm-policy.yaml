# Policy fixture for the `security/policy-llm.yaml` example integration
# test. The example points `config_path` at an operator-supplied
# deployment path; the test rewrites that to this file so the policy
# filter constructs without shipping a policy under examples/.
#
# Shape: one HS256 JWT identity plugin (fail-closed) plus `llm:` routes
# — a per-model route, a role-gated one, and the catch-all that makes
# an unlisted model deny. Because the routes are `llm:` routes, the
# filter parses the model out of the request body and dispatches
# `cmf.llm_input`; no protocol classifier is involved.
#
# The `denyWith` on the catch-all proves an operator can shape the
# refusal an inference client sees.
#
# Production deployments swap HS256 for RS256 + JWKS and source the
# per-caller model allow-list from an attribute file.

plugins:
  - name: jwt-user
    kind: identity/jwt
    hooks: [identity.resolve]
    on_error: fail
    config:
      header: Authorization
      trusted_issuers:
        - issuer: "https://idp.example.com"
          audiences: ["praxis-policy-example"]
          algorithms: ["HS256"]
          decoding_key:
            kind: secret
            secret: "REPLACE-WITH-A-PROPERLY-RANDOM-SHARED-SECRET-DO-NOT-COMMIT"
          leeway_seconds: 60
      claim_mapper: standard

global:
  authentication:
    - jwt-user
  authorization:
    pre_invocation:
      - "require(authenticated)"
      # Refuse a streamed request for every model, not just one: the
      # response half cannot evaluate SSE frames, so a policy that needs
      # post-invocation enforcement has to close the stream up front. On
      # `global` it stacks onto every `llm:` route below.
      - "custom.llm.stream: deny('streaming is not permitted', 'stream_not_allowed')"

routes:
  # Open to any authenticated caller.
  - llm: gpt-4o-mini
    authorization:
      pre_invocation:
        - "require(authenticated)"

  # Reserved for the research role.
  - llm: [gpt-4o, o3]
    authorization:
      pre_invocation:
        - "require(role.research)"

  # Fail closed for every model not named above. `llm.require_route`
  # would refuse an unlisted model anyway; this route shapes the refusal
  # the client sees and keeps the policy's intent on the page.
  - llm: "*"
    authorization:
      pre_invocation:
        - "deny('model is not permitted', 'model_not_allowed')"
    response:
      status: 403
      body: "{\"error\":{\"message\":\"model is not permitted\",\"type\":\"policy_violation\",\"code\":\"model_not_allowed\"}}"
      headers:
        X-Authz-Denied: "model-not-allowed"
