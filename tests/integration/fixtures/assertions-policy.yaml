# Policy fixture for the `security/policy-assertions.yaml` example
# integration test. The example points `config_path` at an
# operator-supplied deployment path; the test rewrites that to this
# file.
#
# An inline HS256 key keeps the assertion test independent of network services.

# A static upstream credential read from the environment. A deployment names
# its own variable; the test reads one Cargo sets for every test process.
secrets:
  providers:
    environment: { kind: env }
  values:
    upstream_api_key: { provider: environment, ref: CARGO_PKG_NAME }

plugins:
  - name: jwt-user
    kind: identity/jwt
    hooks: [identity.resolve]
    mode: sequential
    on_error: fail
    config:
      header: Authorization
      trusted_issuers:
        - issuer: "https://idp.example.com"
          audiences: ["praxis-policy-example"]
          algorithms: ["HS256"]
          decoding_key:
            kind: secret
            secret: "REPLACE-WITH-A-PROPERLY-RANDOM-SHARED-SECRET-DO-NOT-COMMIT"
          leeway_seconds: 60
      claim_mapper: standard

global:
  authentication:
    - jwt-user

  authorization:
    pre_invocation:
      - "require(authenticated)"

  assertions:
    request:
      headers:
        # An admitted request must have a subject.
        - name: x-auth-user-id
          from: subject.id
          on_missing: deny

        - name: x-auth-tenant
          from: claim.tenant

        # Collections require an explicit wire encoding.
        - name: x-auth-roles
          from: subject.roles
          encode: csv

        - name: x-auth-context
          members:
            teams: subject.teams

        # The engine renders the declared secret; no plugin or PDP reads it.
        - name: x-api-key
          from: secret.upstream_api_key

      # Withhold the caller's credential and internal hints from the upstream.
      strip:
        - authorization
        - x-internal-hint

    response:
      headers:
        # Replace an upstream value with the gateway's decision.
        - name: x-decided-for
          from: subject.id
      # Withhold upstream implementation details from the client.
      strip:
        - server
        - x-upstream-internal
