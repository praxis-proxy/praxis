# Policy fixture for the `security/policy-query.yaml` example integration
# test. The example points `config_path` at an operator-supplied deployment
# path; the test rewrites that to this file so the policy filter constructs
# without shipping a policy under examples/.
#
# Shape: one HS256 JWT identity plugin (fail-closed) + a `global` HTTP
# authorization policy that admits only a request whose query string is exactly
# `action=read`. Requests with any other query, or none, are denied with a
# custom response (403 + JSON body + header) carried via the policy's
# `response:` block. This is the entity-less generic-HTTP authz path the
# pure-L7 (`http_global`) shape targets, gating on the request-line query.
#
# Canonical form: the `authentication:` + `authorization:` block form, a
# native `require(authenticated)` presence gate, and the CEL predicate as a
# `cel: { expr }` PDP step (dispatched to the engine's bundled `cel` resolver).
#
# Production deployments swap HS256 for RS256 + JWKS and author richer CEL
# authorization.

engine_settings:
  dispatch: policy

plugins:
  - name: jwt-user
    kind: identity/jwt
    hooks: [identity.resolve]
    on_error: fail
    config:
      header: Authorization
      trusted_issuers:
        - issuer: "https://idp.example.com"
          audiences: ["praxis-policy-example"]
          algorithms: ["HS256"]
          decoding_key:
            kind: secret
            secret: "REPLACE-WITH-A-PROPERLY-RANDOM-SHARED-SECRET-DO-NOT-COMMIT"
      claim_mapper: standard

global:
  # Authentication and authorization are direct `global:` keys.
  authentication:
    - jwt-user
  authorization:
    pre_invocation:
      # Native presence gate, then the query predicate as a CEL PDP step:
      # admit only the `action=read` query (the CEL evaluates false for any
      # other query, and for an absent one, → deny).
      - "require(authenticated)"
      - cel: { expr: "http.query == 'action=read'" }
  # Declares the bundled `cel` resolver into this policy's PDP router. A
  # `cel:` step needs this entry — without it the router has no `cel`
  # resolver and every `cel:` step fails closed (deny). The expression
  # itself lives in the step, so the entry just names the kind.
  pdp:
    - kind: cel
  response:
    status: 403
    body: "{\"error\":\"query not permitted\"}"
    headers:
      X-Authz-Denied: "query-not-allowed"
