[package]
name = "praxis-tests-benches"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "../../README.md"
publish = false
autobenches = false

[lints]
workspace = true

[dev-dependencies]
criterion = { workspace = true }
http = { workspace = true }
praxis-core = { workspace = true }
praxis-filter = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "time"] }

[[bench]]
name = "condition_eval"
path = "benches/condition_eval.rs"
harness = false

[[bench]]
name = "config_parsing"
path = "benches/config_parsing.rs"
harness = false

[[bench]]
name = "filter_pipeline"
path = "benches/filter_pipeline.rs"
harness = false

[[bench]]
name = "headers"
path = "benches/headers.rs"
harness = false

[[bench]]
name = "load_balancer"
path = "benches/load_balancer.rs"
harness = false

[[bench]]
name = "router_lookup"
path = "benches/router_lookup.rs"
harness = false

# Lets the policy filter be compiled into the benchmark binaries so the policy
# hot path can be measured. Off by default, matching the filter crate.
[features]
policy-engine = ["praxis-filter/policy-engine"]
