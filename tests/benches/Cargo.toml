[package]
name = "praxis-tests-benches"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "../../README.md"
publish = false
autobenches = false

[lints]
workspace = true

[dependencies]
dhat = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
governor = { workspace = true }
http = { workspace = true }
parking_lot = { workspace = true }
portable-atomic = { workspace = true }
praxis-core = { workspace = true }
praxis-filter = { workspace = true }
praxis-tls = { workspace = true, features = ["bench-utils"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "time"] }

[[bench]]
name = "condition_eval"
path = "benches/condition_eval.rs"
harness = false

[[bench]]
name = "config_parsing"
path = "benches/config_parsing.rs"
harness = false

[[bench]]
name = "filter_pipeline"
path = "benches/filter_pipeline.rs"
harness = false

[[bench]]
name = "headers"
path = "benches/headers.rs"
harness = false

[[bench]]
name = "json_body"
path = "benches/json_body.rs"
harness = false

[[bench]]
name = "json_body_heap"
path = "benches/json_body_heap.rs"
harness = false
required-features = ["dhat-heap"]

[[bench]]
name = "load_balancer"
path = "benches/load_balancer.rs"
harness = false

[[bench]]
name = "router_lookup"
path = "benches/router_lookup.rs"
harness = false

[[bench]]
name = "token_bucket"
path = "benches/token_bucket.rs"
harness = false

[[bench]]
name = "tls_sni"
path = "benches/tls_sni.rs"
harness = false

[[bench]]
name = "tls_cert_resolution"
path = "benches/tls_cert_resolution.rs"
harness = false

[[bench]]
name = "branch_chains"
path = "benches/branch_chains.rs"
harness = false

[[bench]]
name = "circuit_breaker"
path = "benches/circuit_breaker.rs"
harness = false

# Lets the policy filter be compiled into the benchmark binaries so the policy
# hot path can be measured. Opted into explicitly so a plain bench build
# stays lean; `make test-integration` builds these with --all-features.
[features]
policy-engine = ["praxis-filter/policy-engine"]
upstream-binding = ["praxis-filter/upstream-binding"]
dhat-heap = ["dep:dhat"]
