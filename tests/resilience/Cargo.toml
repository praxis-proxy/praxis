[package]
name = "praxis-tests-resilience"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
publish = false

[features]
# Matches the binary's default; see tests/integration/Cargo.toml.
default = ["pingora", "policy-builtins"]
pingora = ["praxis-test-utils/pingora", "praxis/pingora"]
hyper = ["praxis-test-utils/hyper", "praxis/hyper"]
policy-engine = ["praxis/policy-engine", "praxis-filter/policy-engine", "praxis-test-utils/policy-engine"]
policy-builtins = ["policy-engine", "policy-experimental-ratelimit", "praxis/policy-builtins", "praxis-test-utils/policy-builtins"]
policy-crypto-default = ["policy-engine", "praxis/policy-crypto-default", "praxis-test-utils/policy-crypto-default"]
policy-experimental-ratelimit = ["policy-engine", "praxis/policy-experimental-ratelimit", "praxis-test-utils/policy-experimental-ratelimit"]
hedged-requests = ["praxis/hedged-requests"]
iterative-request-router = ["praxis/iterative-request-router"]

[lints]
workspace = true

[dev-dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
praxis = { workspace = true }
praxis-core = { workspace = true }
praxis-filter = { workspace = true }
praxis-protocol = { workspace = true }
praxis-test-utils = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["net"] }
