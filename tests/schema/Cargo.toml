[package]
name = "praxis-tests-schema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
publish = false

[features]
# TLS and HTTPS active probes. Off by default.
tls-health-check = ["praxis-test-utils/tls-health-check"]
spiffe = ["praxis-core/spiffe"]
upstream-binding = ["praxis-core/upstream-binding"]
slow-start = ["praxis-core/slow-start"]
cloud-events-filter = ["praxis-filter/cloud-events-filter"]

[lints]
workspace = true

[dev-dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
praxis-core = { workspace = true }
praxis-filter = { workspace = true }
praxis-test-utils = { workspace = true }
praxis-tls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
