[package]
name = "praxis-test-utils"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "../../README.md"
publish = false

[lints]
workspace = true

[dependencies]
arc-swap = { workspace = true }
praxis = { workspace = true }
praxis-core = { workspace = true }
praxis-filter = { workspace = true }
# The shared harness exercises the admin/health endpoints and cert hot-reload;
# enabling these here propagates (via feature unification) to every test crate
# that depends on the harness, so the full test surface is always built.
praxis-protocol = { workspace = true, features = ["admin-api", "config-reload"] }
praxis-tls = { workspace = true }
h2 = { workspace = true }
http = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
serde_yaml = { workspace = true }
tempfile = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
pingora-core = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "io-util", "time", "sync"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
tokio-rustls = { workspace = true }
tokio-tungstenite = { workspace = true }

[features]
# Crypto provider passthrough — see crates/tls/src/provider.rs.
openssl = ["praxis-tls/openssl"]
aws-lc-rs = ["praxis-tls/aws-lc-rs"]
