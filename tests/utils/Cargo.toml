[package]
name = "praxis-test-utils"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
publish = false

[features]
# The network backend the proxies the harness starts run on. Each suite crate
# depends on the harness without defaults and forwards exactly one of these:
# `pingora` in its own default set, `hyper` as the opt-in that
# `make test-integration-hyper` and its siblings select.
default = ["pingora"]
pingora = ["praxis/pingora"]
hyper = ["praxis/hyper"]
tls-health-check = ["praxis/tls-health-check"]
# Policy selections. Each one is passed on to a subprocess proxy this harness
# builds, so the binary carries exactly the selection the suite claims.
policy-engine = ["praxis/policy-engine"]
policy-builtins = ["policy-engine", "policy-experimental-ratelimit", "praxis/policy-builtins"]
policy-crypto-default = ["policy-engine", "praxis/policy-crypto-default"]
policy-crypto-fips = ["policy-engine", "praxis/policy-crypto-fips"]
policy-api-key = ["policy-engine", "praxis/policy-api-key"]
policy-api-key-fips = ["policy-api-key", "policy-crypto-fips"]
policy-jwt = ["policy-engine", "praxis/policy-jwt"]
policy-jwt-openssl-fips = ["policy-engine", "praxis/policy-jwt-openssl-fips"]
policy-jwt-fips = ["policy-jwt-openssl-fips", "policy-crypto-fips"]
policy-experimental-ratelimit = ["policy-engine", "praxis/policy-experimental-ratelimit"]
overload-actions = ["praxis/overload-actions"]

[lints]
workspace = true

[dependencies]
# The same two features as praxis-protocol below, plus the backend the suite
# crate forwards, and nothing else: the workspace declares the binary crate
# without its defaults so the policy engine is a choice each test crate makes
# (its policy feature), not a side effect of depending on the
# harness. `--no-default-features` on a test crate therefore builds the proxy
# exactly as the FIPS build does, once it names the backend.
praxis = { workspace = true, features = ["config-reload", "admin-api"] }
praxis-core = { workspace = true }
praxis-filter = { workspace = true }
# The shared harness exercises admin/health/metrics endpoints and cert hot-reload;
# enabling these here propagates (via feature unification) to every test crate
# that depends on the harness, so the full test surface is always built.
praxis-protocol = { workspace = true, features = ["admin-api", "config-reload"] }
praxis-tls = { workspace = true }
cargo_metadata = { workspace = true }
h2 = { workspace = true }
http = { workspace = true }
# Well-formed EC key shares for the raw TLS probes (tls_probe.rs).
openssl = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
serde_yaml = { workspace = true }
tempfile = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "io-util", "time", "sync"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
tokio-rustls = { workspace = true }
tokio-tungstenite = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }
