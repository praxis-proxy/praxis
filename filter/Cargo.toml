[package]
name = "praxis-proxy-filter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Filter pipeline engine and built-in filters for Praxis"
license.workspace = true
repository.workspace = true
readme = "../README.md"
publish = true

[lib]
name = "praxis_filter"

[features]
default = []
policy-engine = [
    "dep:ppe",
]
basic-auth-filter = [
    "dep:base64",
    "dep:sha2",
    "dep:subtle",
]

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true, optional = true }
bytes = { workspace = true }
ppe = { workspace = true, optional = true }
dashmap = { workspace = true }
http = { workspace = true }
metrics = { workspace = true }
percent-encoding = { workspace = true }
pingora-core = { workspace = true }
praxis-core = { workspace = true }
praxis-tls = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
smallvec = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
thiserror = { workspace = true }
# Used by `policy-engine` for plugin `initialize()` at filter
# construction and JWT identity plugins that fetch JWKS at init time.
tokio = { workspace = true, features = ["rt", "sync", "time", "net"] }
tracing = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
metrics-exporter-prometheus = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
