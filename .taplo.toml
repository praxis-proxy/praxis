include = ["**/*.toml"]
exclude = ["target/**"]

[formatting]
# Keys stay in author order: the lint tables in Cargo.toml are grouped by
# commented sections, and reordering would destroy them.
reorder_keys = false
reorder_arrays = false
column_width = 100
# Match the hand-formatted style: 4-space indent, and leave each array's
# one-line or one-per-line layout as the author wrote it.
indent_string = "    "
array_auto_expand = false
array_auto_collapse = false
