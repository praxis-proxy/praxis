# Weighted Route Targets
#
# Routes across separate clusters with a weighted split and a
# priority-tier fallback. The router sends ~90% of requests to
# `stable` and ~10% to `canary` (both priority 0), and spills to
# `dr-a` and `dr-b` (priority 1, 1:1) only when every priority-0
# cluster has no healthy endpoint.
#
# Weighted clusters differ from endpoint weights: each cluster owns
# its own TLS identity and options, so backends that cannot share one
# cluster still share a route. The effective share is
# target_weight / tier_total multiplied by the endpoint's share
# inside the selected cluster.
#
# Route-target health comes from the top-level `clusters` below,
# bound once when the pipeline is installed. The load_balancer repeats
# the same endpoints so it can build its own cluster entries. Every
# failover target needs a health-checked top-level cluster, or its
# priority tier cannot spill.
#
#   ┌────────┐
#   │ client │
#   └───┬────┘
#       │
#   ┌───▼────┐
#   │ proxy  │  :8080
#   └───┬────┘
#       │ smooth weighted round-robin, priority 0: 90:10
#       ├──────────────────────────┐
#   ┌───▼────┐                ┌────▼───┐
#   │ stable │  :3001         │ canary │  :3002
#   └────────┘ ~90%           └────────┘ ~10%
#       │
#       │ both priority-0 clusters unhealthy
#   ┌───▼────┐                ┌─────────┐
#   │ dr-a   │  :3003         │ dr-b    │  :3004
#   └────────┘ ~50%           └─────────┘ ~50%
#
# Usage:
#   cargo run -p praxis-proxy -- \
#     -c examples/configs/traffic-management/weighted-clusters.yaml
#   for i in $(seq 1 10); do
#     curl -s http://localhost:8080/
#     echo
#   done
#   # ~9 responses from :3001, ~1 from :3002

listeners:
  - name: default
    address: "127.0.0.1:8080"
    filter_chains:
      - main

clusters:
  - name: stable
    endpoints:
      - "127.0.0.1:3001"
    health_check:
      type: http
      path: "/healthz"
      expected_status: 200
      interval_ms: 200
      timeout_ms: 100
      healthy_threshold: 1
      unhealthy_threshold: 1

  - name: canary
    endpoints:
      - "127.0.0.1:3002"
    health_check:
      type: http
      path: "/healthz"
      expected_status: 200
      interval_ms: 200
      timeout_ms: 100
      healthy_threshold: 1
      unhealthy_threshold: 1

  - name: dr-a
    endpoints:
      - "127.0.0.1:3003"
    health_check:
      type: http
      path: "/healthz"
      expected_status: 200
      interval_ms: 200
      timeout_ms: 100
      healthy_threshold: 1
      unhealthy_threshold: 1

  - name: dr-b
    endpoints:
      - "127.0.0.1:3004"
    health_check:
      type: http
      path: "/healthz"
      expected_status: 200
      interval_ms: 200
      timeout_ms: 100
      healthy_threshold: 1
      unhealthy_threshold: 1

filter_chains:
  - name: main
    filters:
      - filter: router
        routes:
          - path_prefix: "/"
            weighted_clusters:
              targets:
                - name: stable
                  weight: 90
                  priority: 0
                - name: canary
                  weight: 10
                  priority: 0
                - name: dr-a
                  weight: 1
                  priority: 1
                - name: dr-b
                  weight: 1
                  priority: 1

      - filter: load_balancer
        clusters:
          - name: stable
            load_balancer_strategy: round_robin
            endpoints:
              - address: "127.0.0.1:3001"
          - name: canary
            load_balancer_strategy: round_robin
            endpoints:
              - address: "127.0.0.1:3002"
          - name: dr-a
            load_balancer_strategy: round_robin
            endpoints:
              - address: "127.0.0.1:3003"
          - name: dr-b
            load_balancer_strategy: round_robin
            endpoints:
              - address: "127.0.0.1:3004"

insecure_options:
  allow_private_endpoints: true     # example proxies to local backends
  allow_private_health_checks: true # dev only; loopback health probes
