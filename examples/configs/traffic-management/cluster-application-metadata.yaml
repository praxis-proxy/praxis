# Cluster Application Metadata
#
# Declares application protocol, provider, and input modalities for routed
# upstream clusters. The `application_protocol` field
# declares the wire format the upstream body speaks and
# `application_provider` names the provider-specific flavor. Both stay
# opaque to Praxis core and are validated only as bounded, canonical
# identifiers. Declare accepted input modalities per deployment so
# filters can distinguish clusters that use the same protocol and provider.
#
# Usage:
#   cargo run -p praxis-proxy -- -c examples/configs/traffic-management/cluster-application-metadata.yaml
#   curl -s http://localhost:8080/v1/chat/completions

listeners:
  - name: default
    address: "127.0.0.1:8080"
    filter_chains:
      - main

filter_chains:
  - name: main
    filters:
      - filter: router
        routes:
          - path_prefix: "/vision"
            cluster: vision_backend
          - path_prefix: "/"
            cluster: llm_backend

      - filter: load_balancer
        clusters:
          - name: llm_backend
            http:
              # Opaque identifiers, not enums — interpreted by consuming
              # filters, validated here only as canonical identifiers.
              application_protocol: openai_chat_completions
              application_provider: vllm
              input_modalities: [text]
            endpoints:
              - "127.0.0.1:3001"
          - name: vision_backend
            http:
              application_protocol: openai_chat_completions
              application_provider: vllm
              input_modalities: [text, image]
            endpoints:
              - "127.0.0.1:3002"

insecure_options:
  allow_private_endpoints: true # example proxies to a local backend
