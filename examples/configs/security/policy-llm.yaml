# Inference Authorization
#
# Authorizes body-addressed inference requests against `llm:` policy routes.
# The proxy reads the top-level `model`; missing, unlisted, and ambiguous
# models fail closed by default. No protocol classifier is required.
#
# Point `config_path` at an operator-supplied policy. The integration fixture
# at `tests/integration/fixtures/llm-policy.yaml` provides a local example.
# `tests/integration/fixtures/llm-request-policy.yaml` adds OPA and CEL
# rules that read the parsed request body, such as its `tools`, as
# `llm.request`. It also demonstrates a prompt rule over Responses tool history.
#
# The standard build includes the Policy builtins. For a build with defaults
# disabled, select the builtins referenced by the operator-supplied policy.
#
# Usage:
#   cargo run -p praxis-proxy --features policy-builtins -- -c examples/configs/security/policy-llm.yaml
#
listeners:
  - name: default
    address: "127.0.0.1:8080"
    filter_chains:
      - main

filter_chains:
  - name: main
    filters:
      - filter: policy
        config_path: /etc/praxis/llm-policy.yaml
        llm:
          require_model: true
          provider: openai

      # URL-addressed providers do not expose the model this filter evaluates.
      - filter: router
        routes:
          - path_prefix: "/v1/"
            cluster: inference

      - filter: load_balancer
        clusters:
          - name: inference
            endpoints:
              - "127.0.0.1:3000"

insecure_options:
  allow_private_endpoints: true
