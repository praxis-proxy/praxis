# Basic Authentication
#
# Authenticate requests using HTTP Basic Authentication (RFC 7617).
# Credentials are validated against an inline list of username/password
# pairs. Unauthenticated requests receive a 401 response with a
# WWW-Authenticate challenge header. The Authorization header is
# stripped before forwarding to prevent credential leakage upstream.
#
# Usage:
#   cargo run -p praxis-proxy -- -c examples/configs/security/basic-auth.yaml
#
# Exercise:
#   curl http://localhost:8080/                  # 401 Unauthorized
#   curl -u admin:secret http://localhost:8080/   # 200 OK
#   curl -u readonly:viewer http://localhost:8080/ # 200 OK
#   curl -u admin:wrong http://localhost:8080/    # 401 Unauthorized

listeners:
  - name: default
    address: "127.0.0.1:8080"
    filter_chains:
      - main

filter_chains:
  - name: main
    filters:
      - filter: basic_auth
        realm: "Praxis Example"
        strip_authorization: true
        credentials:
          - username: admin
            password: secret
          - username: readonly
            password: viewer

      - filter: router
        routes:
          - path_prefix: "/"
            cluster: backend

      - filter: load_balancer
        clusters:
          - name: backend
            endpoints:
              - "127.0.0.1:3000"
