# Peer Identity Trust
#
# Validates downstream mTLS peer identity against a
# set of trusted peers. Requests without a verified
# peer identity or with an untrusted identity are
# rejected with 403.
#
# Requires mTLS on the listener. Each trusted peer
# entry matches on certificate digest, organization,
# or serial number. All configured fields on an entry
# must match.
#
# Setup: replace the server certificate/key and client CA paths
# below with local PEM files. The client CA verifies client
# identities; the server certificate must cover localhost, and
# curl must trust its issuing CA in server-ca.pem. Replace the
# sample cert_digest with the lowercase SHA-256 digest of the
# trusted client's DER certificate (for example, use
# `openssl x509 -in client.pem -outform DER | openssl dgst -sha256`).
# The gateway-peer client certificate must have O=gateway-peer
# and be signed by the configured client CA.
# The trusted-sidecar entry matches any CA-verified certificate
# with that organization; digest pinning is stronger.
# Start an HTTP backend on 127.0.0.1:3000 before running Praxis.
# Then connect with:
#   curl --cert client.pem --key client-key.pem --cacert server-ca.pem \
#     https://localhost:8080/
# A client without a certificate is refused during TLS handshake.
#
# ⚠️  EXPERIMENTAL: This example uses the `spiffe` experimental feature.
# Not recommended for production use. Build with --features spiffe.
#
# Usage:
#   cargo run -p praxis-proxy --features spiffe -- \
#     -c examples/configs/security/peer-identity-trust.yaml

listeners:
  - name: mtls-gateway
    address: "127.0.0.1:8080"
    filter_chains:
      - trusted-peers
    tls:
      certificates:
        - cert_path: /etc/praxis/server.pem
          key_path: /etc/praxis/server-key.pem
      client_ca:
        ca_path: /etc/praxis/client-ca.pem
      client_cert_mode: require

filter_chains:
  - name: trusted-peers
    filters:
      - filter: peer_identity_trust
        trusted_peers:
          - cert_digest: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2"
            organization: gateway-peer
          - organization: trusted-sidecar

      - filter: router
        routes:
          - path_prefix: "/"
            cluster: backend

      - filter: load_balancer
        clusters:
          - name: backend
            endpoints:
              - "127.0.0.1:3000"

insecure_options:
  allow_private_endpoints: true # example proxies to local backends
