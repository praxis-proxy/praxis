# Guardrails
#
# Reject requests that match header or body inspection
# rules. Rules use literal substring matching (`contains`)
# or regex (`pattern`). Set `negate: true` to invert the
# match (reject when content does NOT match). Any triggered
# rule returns 403 Forbidden.
#
# Usage:
#   cargo run -p praxis-proxy -- \
#     -c examples/configs/security/guardrails.yaml
#
# Exercise:
#   # 200: clean JSON-shaped request with required header
#   curl -H 'X-Authorized: trusted-client' \
#     -d '{"key":"value"}' http://localhost:8080/
#
#   # 403: bad-bot User-Agent matches pattern
#   curl -H 'User-Agent: bad-bot/1.0' \
#     -H 'X-Authorized: trusted-client' \
#     -d '{"key":"value"}' http://localhost:8080/
#
#   # 403: body contains "evilmonkey"
#   curl -H 'X-Authorized: trusted-client' \
#     -d '{"text":"evilmonkey payload"}' http://localhost:8080/
#
#   # 403: missing X-Authorized header (negate rule)
#   curl -d '{"key":"value"}' http://localhost:8080/
#
#   # 200: X-Authorized header present with "trusted" and valid body shape
#   curl -H 'X-Authorized: trusted-client' \
#     -d '{"key":"value"}' http://localhost:8080/
#
#   # 403: body does not match the brace-delimited shape (negate rule)
#   curl -H 'X-Authorized: trusted-client' \
#     -d 'not json' http://localhost:8080/
#
#   # 200: body matches the shape check (not full JSON syntax validation)
#   curl -H 'X-Authorized: trusted-client' \
#     -d '{"key":"value"}' http://localhost:8080/

listeners:
  - name: default
    address: "127.0.0.1:8080"
    filter_chains:
      - main

filter_chains:
  - name: main
    filters:
      - filter: guardrails
        rules:
          # Block known bad bots by User-Agent
          - target: header
            name: "User-Agent"
            pattern: "bad-bot.*"

          # Block body containing suspicious content
          - target: body
            contains: "evilmonkey"

          # Require X-Authorized header to contain "trusted"
          # (reject if NOT present or NOT matching)
          - target: header
            name: "X-Authorized"
            contains: "trusted"
            negate: true

          # Require a brace-delimited body shape (not JSON syntax validation)
          # (reject if body does NOT match the pattern)
          - target: body
            pattern: "^\\{.*\\}$"
            negate: true

          # Block PII in body
          - target: body
            contains: [ssn, credit_card, phone, email]

          # Block PII in header
          - target: header
            name: "X-Secret"
            contains: [ssn, credit_card, phone, email]

      - filter: router
        routes:
          - path_prefix: "/"
            cluster: backend

      - filter: load_balancer
        clusters:
          - name: backend
            endpoints:
              - "127.0.0.1:3000"

insecure_options:
  allow_private_endpoints: true # example proxies to local backends
