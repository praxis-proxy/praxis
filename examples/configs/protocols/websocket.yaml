# WebSocket Proxy
#
# HTTP listener that transparently proxies WebSocket upgrade
# requests. Pingora detects the Upgrade handshake and switches
# to bidirectional byte forwarding after the 101 response.
# Praxis validates the HTTP/1.1 handshake before request filters
# and rejects upgrades that would skip selected required body processing.
# No special configuration is needed for Pingora; Hyper does not
# support WebSocket passthrough.
#
#   Client -> WS -> Praxis :8080 -> WS -> Backend :3000
#
# Usage:
#   cargo run -p praxis-proxy -- -c examples/configs/protocols/websocket.yaml

listeners:
  - name: web
    address: "127.0.0.1:8080"
    filter_chains: [ main ]

filter_chains:
  - name: main
    filters:
      - filter: request_id
      - filter: access_log
      - filter: router
        routes:
          - path_prefix: "/"
            cluster: backend
      - filter: load_balancer
        clusters:
          - name: backend
            endpoints:
              - "127.0.0.1:3000"

insecure_options:
  allow_private_endpoints: true # example proxies to local backends
