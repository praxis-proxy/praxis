# WebSocket Proxy
#
# HTTP listener that explicitly permits opaque WebSocket passthrough.
# Pingora switches to bidirectional byte forwarding after a valid
# 101 response. Selected filters that require HTTP body processing
# cause the handshake to be rejected before the upstream is contacted.
#
#   Client -> WS -> Praxis :8080 -> WS -> Backend :3000
#
# Usage:
#   cargo run -p praxis-proxy -- -c examples/configs/protocols/websocket.yaml

listeners:
  - name: web
    address: "127.0.0.1:8080"
    upgrade_policy:
      default: deny
      protocols:
        websocket: passthrough
    filter_chains: [ main ]

filter_chains:
  - name: main
    filters:
      - filter: request_id
      - filter: access_log
      - filter: router
        routes:
          - path_prefix: "/"
            cluster: backend
      - filter: load_balancer
        clusters:
          - name: backend
            endpoints:
              - "127.0.0.1:3000"

insecure_options:
  allow_private_endpoints: true # example proxies to local backends
