# Field Extraction for Tenant Routing
#
# Extracts the "tenant_id" field from the JSON request body
# and promotes it to a client-unspoofable X-Praxis-Tenant-Id
# header. The router directs recognized body tenant values to
# their configured backend clusters.
#
# Unknown or missing tenants fall through to a default cluster.
# Tenant isolation requires separate authorization that binds
# the selected tenant to an authenticated identity.
#
# Usage:
#   cargo run -p praxis-proxy -- -c examples/configs/payload-processing/field-extraction-access-control.yaml
#
#   curl -X POST http://localhost:8080/api/data \
#     -H "Content-Type: application/json" \
#     -d '{"tenant_id": "acme", "query": "..."}'
#
# This routes to the acme cluster. A request with
# "tenant_id": "globex" routes to the globex cluster.
# Missing or unrecognized tenants route to the default.

listeners:
  - name: api-gateway
    address: "0.0.0.0:8080" # dev value; binds all interfaces
    filter_chains:
      - extract-tenant
      - routing

filter_chains:
  - name: extract-tenant
    filters:
      - filter: json_body_field
        field: tenant_id
        header: X-Praxis-Tenant-Id

  - name: routing
    filters:
      - filter: router
        routes:
          - path_prefix: "/"
            headers:
              x-praxis-tenant-id: "acme"
            cluster: acme
          - path_prefix: "/"
            headers:
              x-praxis-tenant-id: "globex"
            cluster: globex
          - path_prefix: "/"
            cluster: default
      - filter: load_balancer
        clusters:
          - name: acme
            endpoints:
              - "10.0.1.1:8080"
              - "10.0.1.2:8080"
          - name: globex
            endpoints:
              - "10.0.2.1:8080"
          - name: default
            endpoints:
              - "10.0.3.1:8080"
