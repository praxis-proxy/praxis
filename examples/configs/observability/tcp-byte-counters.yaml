# TCP Byte Counters
#
# Prometheus counters for bytes forwarded over TCP connections in each
# direction, labeled by listener. Totals stay accurate when a session ends
# on an idle timeout or shutdown rather than a clean close. Scraped via the
# metrics listener.
#
# Usage:
#   cargo run -p praxis-proxy -- -c examples/configs/observability/tcp-byte-counters.yaml
#
# Exercise:
#   echo "SELECT 1" | nc localhost 5432
#   curl -s http://localhost:9902/metrics | grep tcp_bytes

admin:
  metrics_address: "127.0.0.1:9902"

insecure_options:
  allow_private_upstreams: true

listeners:
  - name: postgres
    address: "127.0.0.1:5432"
    protocol: tcp
    upstream: "127.0.0.1:15432"
