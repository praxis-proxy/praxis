# Upstream Requests Total
#
# Prometheus counter for requests that reached an upstream endpoint,
# labeled by cluster, endpoint and status class. Requests answered by the
# proxy itself are excluded, so the gap against praxis_http_requests_total
# is proxy-generated traffic. Scraped via the metrics listener.
#
# Usage:
#   cargo run -p praxis-proxy -- -c examples/configs/observability/upstream-requests-total.yaml
#
# Exercise:
#   curl -s http://localhost:8080/api/hello
#   curl -s http://localhost:9902/metrics | grep upstream_requests_total

admin:
  metrics_address: "127.0.0.1:9902"

insecure_options:
  allow_private_endpoints: true

listeners:
  - name: web
    address: "127.0.0.1:8080"
    filter_chains:
      - routing

filter_chains:
  - name: routing
    filters:
      - filter: router
        routes:
          - path_prefix: "/api/"
            cluster: backend
      - filter: load_balancer
        clusters:
          - name: backend
            endpoints:
              - "127.0.0.1:3000"
