# Process Logging: File Output with Size Rotation
#
# Non-blocking process logs written to a rotating file. Size-based rotation
# keeps the active file at file_path; rolled copies use proxy.log.1, proxy.log.2, …
#
# Usage:
#   RUST_LOG=info cargo run -p praxis-proxy -- -c examples/configs/observability/process-logging.yaml
#   tail -f /tmp/praxis-process.log

runtime:
  logging:
    output: file
    file_path: /tmp/praxis-process.log
    rotation: size:1mb
    max_files: 7
    non_blocking: true
    buffer_size: 8192

listeners:
  - name: default
    address: "127.0.0.1:8080"
    filter_chains: [main]

filter_chains:
  - name: main
    filters:
      - filter: static_response
        status: 200
        body: "ok"
