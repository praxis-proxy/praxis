[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Development task runner for Praxis"
license.workspace = true
repository.workspace = true
readme = "../README.md"
publish = false

[lints]
workspace = true

[features]
default = ["dev"]
# Everything except the FIPS tasks: the proxy itself (echo, debug), the
# benchmark harness and the filter-docs generator. Off inside the FIPS check
# image, which needs only `cargo xtask fips` and must not compile the standard
# proxy build to get it.
dev = [
    "dep:chrono",
    "dep:nix",
    "dep:plotters",
    "dep:praxis",
    # The standard build, policy engine included: `cargo xtask debug` runs the
    # example configs, some of which use the `policy` filter.
    "praxis/default",
    "dep:praxis-core",
    "dep:praxis-proxy-benchmarks",
    "dep:quote",
    "dep:serde_yaml",
    "dep:syn",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-subscriber",
]

[dependencies]
base64 = { workspace = true }
chrono = { workspace = true, optional = true }
clap = { workspace = true }
flate2 = { workspace = true }
nix = { workspace = true, optional = true }
object = { workspace = true }
openssl = { workspace = true }
plotters = { workspace = true, optional = true }
praxis = { workspace = true, optional = true }
praxis-core = { workspace = true, optional = true }
praxis-proxy-benchmarks = { workspace = true, optional = true }
quote = { workspace = true, optional = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true, optional = true }
syn = { workspace = true, optional = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "process", "net", "io-util"], optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
