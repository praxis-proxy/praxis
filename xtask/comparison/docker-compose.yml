# Comparison benchmark environment.
#
# All proxies share the same Fortio echo backend and identical
# resource constraints (4 CPUs, 2GB RAM). Run one proxy at
# a time to avoid contention.
#
# Every service uses host networking, so each listens on its own host port
# (see the configs) and reaches the backend at 127.0.0.1:18080, exactly as
# when xtask runs them.
#
# Usage:
#   docker compose up -d backend
#   docker compose up -d praxis   # or envoy, nginx, haproxy
#
# Normally called via xtask:
#   cargo xtask benchmark --proxy praxis --proxy envoy --proxy nginx --proxy haproxy

services:
  backend:
    network_mode: host
    image: fortio/fortio:latest
    command: server -http-port 18080
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 2G

  praxis:
    network_mode: host
    build:
      context: ../..
      dockerfile: Containerfile
    volumes:
      - ./configs/praxis.yaml:/etc/praxis/config.yaml:ro
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 2G
    depends_on:
      - backend

  envoy:
    network_mode: host
    image: envoyproxy/envoy:v1.31-latest
    volumes:
      - ./configs/envoy.yaml:/etc/envoy/envoy.yaml:ro
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 2G
    depends_on:
      - backend

  nginx:
    network_mode: host
    image: nginx:alpine
    volumes:
      - ./configs/nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 2G
    depends_on:
      - backend

  haproxy:
    network_mode: host
    image: haproxy:latest
    volumes:
      - ./configs/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 2G
    depends_on:
      - backend
