apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: praxis

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml
  - networkpolicy.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: praxis-config
    files:
      - config.yaml=praxis.yaml

