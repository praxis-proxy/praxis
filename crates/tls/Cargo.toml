[package]
name = "praxis-proxy-tls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "TLS configuration types and validation for Praxis"
license.workspace = true
repository.workspace = true
readme = "../../README.md"
publish = true

[lib]
name = "praxis_tls"

[lints]
workspace = true

[features]
config-reload = ["dep:arc-swap", "dep:notify", "dep:tokio"]
# SPIFFE X.509-SVID mTLS peer identity. Off by default; experimental.
spiffe = ["dep:spiffe", "dep:x509-parser"]
# Expose test utilities for benchmarks.
bench-utils = ["dep:rcgen", "dep:tempfile"]

[dependencies]
arc-swap = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
rustls = { workspace = true }
# The one crypto provider: system OpenSSL through rustls. See src/provider.rs.
rustls-openssl = { workspace = true }
serde = { workspace = true }
spiffe = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt"], optional = true }
tracing = { workspace = true }
# Parsing only: the `verify`/`ring` features stay off so all crypto goes through
# the injected rustls provider (FIPS). Do not enable them here.
x509-parser = { workspace = true, optional = true }
zeroize = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
rcgen = { workspace = true }
serde_yaml = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
