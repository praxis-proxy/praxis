[package]
name = "praxis-proxy-tls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "TLS configuration types and validation for Praxis"
license.workspace = true
repository.workspace = true
readme = "../../README.md"
publish = true

[lib]
name = "praxis_tls"

[lints]
workspace = true

[features]
default = ["openssl"]
config-reload = ["dep:arc-swap", "dep:notify", "dep:tokio"]
# SPIFFE X.509-SVID mTLS peer identity. Off by default; experimental.
spiffe = ["dep:spiffe", "dep:x509-parser"]
# Expose test utilities for benchmarks.
bench-utils = ["dep:rcgen", "dep:tempfile"]

# Crypto provider selection. Exactly one must be enabled; see
# `src/provider.rs`. rustls itself performs no cryptography — it delegates
# every primitive to the installed provider.
#
# `openssl` routes cryptography to the system libcrypto.so, which on a
# FIPS-enabled host is the platform's validated module. This is the
# configuration Praxis targets for FIPS 140-3.
openssl = ["dep:rustls-openssl"]
# Statically linked AWS-LC. Builds without system OpenSSL, but the validated
# module would be AWS's rather than the platform's.
aws-lc-rs = ["rustls/aws_lc_rs"]

[dependencies]
arc-swap = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
rustls = { workspace = true }
rustls-openssl = { workspace = true, optional = true }
serde = { workspace = true }
spiffe = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt"], optional = true }
tracing = { workspace = true }
# Parsing only: the `verify`/`ring` features stay off so all crypto goes through
# the injected rustls provider (FIPS). Do not enable them here.
x509-parser = { workspace = true, optional = true }
zeroize = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
rcgen = { workspace = true }
serde_yaml = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
