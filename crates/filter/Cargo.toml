[package]
name = "praxis-proxy-filter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Filter pipeline engine and built-in filters for Praxis"
license.workspace = true
repository.workspace = true
readme = "../../README.md"
publish = true

[lib]
name = "praxis_filter"

[features]
default = ["policy-engine"]
policy-engine = [
    "dep:ppe",
]
basic-auth-filter = [
    "dep:sha2",
    "dep:subtle",
]
otel = [
    "dep:opentelemetry",
    "dep:tracing-opentelemetry",
]

cloud-events-filter = [
    "dep:chrono",
    "dep:url",
]

# The `iterative_request_router` filter (framework-level multi-sub-request
# loop). Off by default; experimental. Carries no extra dependencies.
iterative-request-router = []

# The `router` filter's JSON-alias body-routing groundwork. Off by default;
# experimental and not yet wired into request routing.
router-json-aliases = []

# The chain-binding registry extension API (register_chain_binding /
# ChainBindingContext::bind_chain). Off by default; experimental. No in-tree
# consumer yet; provided for out-of-tree callout filters.
chain-binding = []

# The `peer_identity_trust` filter (mTLS peer-identity authorization). Off by
# default; experimental. Grouped with the server's `spiffe` feature.
spiffe = []

# This crate inherits the full workspace lint set. Unlike the other crates it
# does NOT raise `unsafe_code` back to "forbid": the `json_ops::simd_scan` SIMD
# intrinsics need unsafe, and their functions opt in with a reasoned
# `#[expect(unsafe_code)]`. The inherited workspace level of "deny" allows those
# while still flagging unsafe anywhere else in the crate.
[lints]
workspace = true

[dependencies]
chrono = { workspace = true, optional = true }
arc-swap = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
ppe = { workspace = true, optional = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
http = { workspace = true }
metrics = { workspace = true }
opentelemetry = { workspace = true, optional = true }
percent-encoding = { workspace = true }
pingora-core = { workspace = true }
praxis-core = { workspace = true }
praxis-tls = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
smallvec = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
thiserror = { workspace = true }
# Used by `policy-engine` for plugin `initialize()` at filter
# construction and JWT identity plugins that fetch JWKS at init time.
tokio = { workspace = true, features = ["rt", "sync", "time", "net"] }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true, optional = true }
url = { workspace = true, optional = true }
zeroize = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
jsonwebtoken = { workspace = true }
opentelemetry_sdk = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "io-util"] }
tracing-subscriber = { workspace = true }
