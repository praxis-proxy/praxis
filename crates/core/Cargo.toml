[package]
name = "praxis-proxy-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Configuration, error types, and server factory for Praxis"
license.workspace = true
repository.workspace = true
readme = "../../README.md"
publish = true

[lib]
name = "praxis_core"

[lints]
workspace = true

[features]
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tonic",
    "dep:tracing-opentelemetry",
]

[dependencies]
bytes = { workspace = true }
dashmap = { workspace = true }
http = { workspace = true }
metrics = { workspace = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
percent-encoding = { workspace = true }
pingora-core = { workspace = true }
pingora-http = { workspace = true }
praxis-tls = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }

tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tonic = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
h2 = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "test-util"] }
