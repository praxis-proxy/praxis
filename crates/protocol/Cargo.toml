[package]
name = "praxis-proxy-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "HTTP, TCP, and protocol adapters for Praxis"
license.workspace = true
repository.workspace = true
readme.workspace = true

[lib]
name = "praxis_protocol"

[features]
# Adapter-neutral local HTTP lifecycle; live serving is not enabled yet.
local-http = ["praxis-filter/local-http"]
# TLS and HTTPS active probes. Off by default.
tls-health-check = ["pingora", "praxis-core/tls-health-check"]
# The Pingora network backend: the HTTP and TCP protocol adapters, the
# admin-surface glue and `backend::{Http, Tcp}` resolve to Pingora and the
# fork crates are linked. On by default. Without any backend feature the
# crate still compiles (the backend-neutral handlers, metrics and health
# probes stay) so lean builds can be checked. See
# docs/developing/adding-backends.md.
default = ["pingora"]
pingora = ["dep:pingora-core", "dep:pingora-http", "dep:pingora-proxy", "praxis-core/pingora"]
# The hyper network backend: the HTTP and TCP adapters, the admin glue and
# `backend::{Http, Tcp}` resolve to hyper. Off by default and experimental.
# The two backend features are mutually exclusive; a hyper build starts from
# `--no-default-features`. See docs/developing/adding-backends.md.
hyper = [
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:tokio-rustls",
    "praxis-core/hyper",
    "tokio/io-util",
    "tokio/net",
    "tokio/rt",
]
# Certificate + config hot-reload (filesystem watching). Enables the
# reload/watcher machinery in praxis-tls. Off => static TLS, no notify.
# Off by default at the library level; the `praxis-proxy` binary turns it
# on via its own default so lean builds (--no-default-features) can drop it.
config-reload = ["praxis-tls/config-reload"]
# Admin and health/metrics HTTP surfaces. Off => those endpoints are not compiled in
# (the proxy data path and background health checks are unaffected). Library
# default is off; the `praxis-proxy` binary and the test harness turn it on.
admin-api = []
# Logical upstream binding in the filter crate this crate embeds. Off by
# default; forwarded so this crate's own tests can exercise the bound access
# log fallback. The `praxis-proxy` binary turns it on through its own feature.
upstream-binding = ["praxis-filter/upstream-binding"]
# SPIFFE X.509-SVID mTLS peer identity. Off by default; experimental.
spiffe = ["praxis-tls/spiffe"]
# W3C remote parenting and exported HTTP client spans. Off by default.
otel = ["praxis-core/otel", "dep:tracing-opentelemetry"]
# Test-only hooks (the upstream retry gate) for the integration suites. Off
# by default so release builds carry no test synchronization on the data path.
test-support = []
# Hedged requests. Off by default. The server feature of the same name also
# turns on `experimental`.
hedged-requests = []
# The `policy` filter (Praxis Policy Engine) in the filter crate this crate
# embeds. Off by default at the library level, like the other forwards here;
# the `praxis-proxy` binary turns it on via its own default. A library consumer
# that wants the policy engine enables this (or `praxis-proxy-filter/policy-engine`
# directly); one that does not simply leaves it off.
policy-engine = ["praxis-filter/policy-engine"]

[lints]
workspace = true

[dependencies]
arc-swap = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
h2 = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, features = ["http1", "http2", "server"], optional = true }
hyper-util = { workspace = true, features = ["http1", "http2", "server", "server-auto", "server-graceful", "tokio"], optional = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
pingora-core = { workspace = true, optional = true }
pingora-http = { workspace = true, optional = true }
pingora-proxy = { workspace = true, optional = true }
# The workspace entry carries no defaults: the backend is chosen here, by this
# crate's `pingora` feature.
praxis-core = { workspace = true }
praxis-filter = { workspace = true }
praxis-tls = { workspace = true }
rand = { workspace = true }
# Names the listener `ServerConfig` the backend-neutral TLS builder returns.
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tokio-rustls = { workspace = true, optional = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true, optional = true }

[dev-dependencies]
praxis-core = { workspace = true, features = ["test-support"] }
rcgen = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }

[[example]]
name = "local-http"
path = "examples/local_http.rs"
required-features = ["local-http"]
