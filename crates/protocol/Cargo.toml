[package]
name = "praxis-proxy-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "HTTP, TCP, and protocol adapters for Praxis"
license.workspace = true
repository.workspace = true
readme = "../../README.md"
publish = true

[lib]
name = "praxis_protocol"

[features]
default = []
# Certificate + config hot-reload (filesystem watching). Enables the
# reload/watcher machinery in praxis-tls. Off => static TLS, no notify.
# Off by default at the library level; the `praxis-proxy` binary turns it
# on via its own default so lean builds (--no-default-features) can drop it.
config-reload = ["praxis-tls/config-reload"]
# Admin HTTP surface: management API (/api/*), Prometheus /metrics, and the
# /healthy + /ready endpoints. Off => none of those endpoints are compiled in
# (the proxy data path and background health checks are unaffected). Library
# default is off; the `praxis-proxy` binary and the test harness turn it on.
admin-api = []

[lints]
workspace = true

[dependencies]
arc-swap = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
pingora-core = { workspace = true }
pingora-http = { workspace = true }
pingora-proxy = { workspace = true }
praxis-core = { workspace = true }
praxis-filter = { workspace = true }
praxis-tls = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
rcgen = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
