[package]
name = "praxis-simd-scan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "SIMD-accelerated byte scanner for JSON string delimiters"
license.workspace = true
repository.workspace = true
readme = "../../README.md"
publish = true

# ---------------------------------------------------------------------------
# Lint configuration
#
# This crate does NOT inherit `[lints] workspace = true` because the workspace
# sets `unsafe_code = "forbid"`.  SIMD intrinsics require unsafe blocks, so we
# duplicate the workspace rules here with `unsafe_code = "deny"` and use
# targeted `#[allow(unsafe_code)]` on the specific functions that need it.
# ---------------------------------------------------------------------------

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
dead_code = "deny"
# Lowered from workspace "forbid" to "deny" so SIMD intrinsic functions can
# opt in with `#[allow(unsafe_code)]`.
unsafe_code = "deny"
missing_docs = "deny"
unreachable_pub = "deny"
unused_imports = "deny"
unused_variables = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
macro_use_extern_crate = "deny"
unused_extern_crates = "deny"
elided_lifetimes_in_paths = "deny"
single_use_lifetimes = "deny"
unused_qualifications = "deny"
unused_macro_rules = "deny"
meta_variable_misuse = "deny"
let_underscore_drop = "deny"
keyword_idents_2024 = "deny"
non_ascii_idents = "deny"
noop_method_call = "deny"
redundant_lifetimes = "deny"
unused_lifetimes = "deny"
unnameable_types = "deny"
redundant_imports = "deny"
unit_bindings = "deny"
explicit_outlives_requirements = "deny"
missing_debug_implementations = "allow"

[lints.clippy]
