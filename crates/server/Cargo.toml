[package]
name = "praxis-proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Cloud-native proxy server"
license.workspace = true
repository.workspace = true
readme.workspace = true

[lib]
name = "praxis"
path = "src/lib.rs"

[[bin]]
name = "praxis"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { workspace = true }
notify = { workspace = true, optional = true }
praxis-core = { workspace = true }
praxis-filter = { workspace = true }
praxis-tls = { workspace = true }
praxis-protocol = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "fs"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }
tikv-jemallocator = { workspace = true }

[build-dependencies]
cargo_metadata = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = ["config-reload", "admin-api", "policy-engine"]

# Config-file and TLS certificate hot-reload (filesystem watching via
# `notify`). On by default; disable for a leaner build that drops the
# watchers and the `notify`/`arc-swap`/`tokio` deps they pull into tls.
config-reload = ["dep:notify", "praxis-protocol/config-reload"]
# Admin API and health/metrics HTTP surfaces. On by default; listeners bind
# only when `admin.address` or `admin.metrics_address` is set.
# Disable for a build with no external observability/admin surface.
admin-api = ["praxis-protocol/admin-api"]
dev = ["basic-auth-filter"]
basic-auth-filter = ["praxis-filter/basic-auth-filter", "experimental"]
cloud-events-filter = ["praxis-filter/cloud-events-filter", "experimental"]
# Logical upstream binding (`bound_upstream` conditions, bound load balancers).
# Off by default; experimental. Implied by `iterative-request-router` and
# `bound-upstream-request-body`.
upstream-binding = ["praxis-filter/upstream-binding", "praxis-protocol/upstream-binding", "experimental"]
# The `iterative_request_router` filter. Off by default; experimental.
iterative-request-router = ["praxis-filter/iterative-request-router", "upstream-binding", "experimental"]
# The `router` filter's JSON-alias body-routing groundwork. Off by default; experimental.
router-json-aliases = ["praxis-filter/router-json-aliases", "experimental"]
# The bound-upstream request-body hook. Off by default; experimental.
bound-upstream-request-body = ["praxis-filter/bound-upstream-request-body", "upstream-binding", "experimental"]
# The chain-binding registry extension API. Off by default; experimental.
chain-binding = ["praxis-filter/chain-binding", "experimental"]
# SPIFFE X.509-SVID mTLS peer identity. Off by default; experimental.
spiffe = ["praxis-protocol/spiffe", "praxis-filter/spiffe", "experimental"]
# The `policy` filter (Praxis Policy Engine). On by default. The workspace
# declares praxis-filter with `default-features = false`, so this feature is
# the only thing that turns the filter's `policy-engine` on; a
# `--no-default-features` build (`make build-fips`) excludes the filter and
# the whole `ppe` tree.
policy-engine = ["praxis-filter/policy-engine", "praxis-protocol/policy-engine"]
# Marker feature activated transitively by any experimental feature.
# Used to gate the startup warning in startup_checks::warn_experimental_features.
experimental = []
otel = ["praxis-core/otel", "praxis-filter/otel"]
