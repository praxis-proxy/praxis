[package]
name = "praxis-proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Cloud-native proxy server"
license.workspace = true
repository.workspace = true
readme.workspace = true

[lib]
name = "praxis"
path = "src/lib.rs"

[[bin]]
name = "praxis"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { workspace = true }
notify = { workspace = true, optional = true }
# The workspace entries for the two crates that carry a backend have no
# defaults: this crate's `pingora` feature is the one switch that selects it.
praxis-core = { workspace = true }
praxis-filter = { workspace = true }
praxis-tls = { workspace = true }
praxis-protocol = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "fs"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }
tikv-jemallocator = { workspace = true }
tikv-jemalloc-sys = { workspace = true, optional = true, features = ["stats"] }

[build-dependencies]
cargo_metadata = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
praxis-core = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
# TLS and HTTPS active probes. Off by default.
tls-health-check = ["praxis-protocol/tls-health-check", "experimental"]
default = ["pingora", "config-reload", "admin-api", "policy-builtins"]

# The network backend. A build with no backend feature refuses to compile
# (see src/lib.rs). `pingora` is on by default; a `--no-default-features`
# build names the backend it wants, as `make release-fips` and `make
# build-hyper` do. See docs/developing/adding-backends.md.
pingora = ["praxis-core/pingora", "praxis-protocol/pingora"]
# The hyper network backend. Off by default; experimental. The two backend
# features are mutually exclusive; a hyper build starts from
# `--no-default-features`.
hyper = ["praxis-core/hyper", "praxis-protocol/hyper", "experimental"]

# Config-file and TLS certificate hot-reload (filesystem watching via
# `notify`). On by default; disable for a leaner build that drops the
# watchers and the `notify`/`arc-swap`/`tokio` deps they pull into tls.
config-reload = ["dep:notify", "praxis-protocol/config-reload"]
# Admin API and health/metrics HTTP surfaces. On by default; listeners bind
# only when `admin.address` or `admin.metrics_address` is set.
# Disable for a build with no external observability/admin surface.
admin-api = ["praxis-protocol/admin-api"]
dev = ["basic-auth-filter"]
basic-auth-filter = ["praxis-filter/basic-auth-filter", "experimental"]
cloud-events-filter = ["praxis-filter/cloud-events-filter", "experimental"]
# Graduated overload actions. Both runtime overload flags must also be enabled.
overload-actions = ["dep:tikv-jemalloc-sys", "experimental"]
# Logical upstream binding (`bound_upstream` conditions, bound load balancers).
# Off by default; experimental. Implied by `iterative-request-router` and
# `bound-upstream-request-body`.
upstream-binding = ["praxis-filter/upstream-binding", "praxis-protocol/upstream-binding", "experimental"]
# The `iterative_request_router` filter. Off by default; experimental.
iterative-request-router = ["praxis-filter/iterative-request-router", "upstream-binding", "experimental"]
# The `router` filter's JSON-alias body-routing groundwork. Off by default; experimental.
router-json-aliases = ["praxis-filter/router-json-aliases", "experimental"]
# Per-cluster slow start. Off by default; experimental. With the feature on,
# weighted strategies apply the ramp. Hash strategies do not.
slow-start = ["praxis-filter/slow-start", "experimental"]
# The listener `forward_proxy` block (HTTP CONNECT forward proxying). Off by
# default; experimental. Without it the block is an unknown key.
forward-proxy = ["praxis-core/forward-proxy", "experimental"]
# The bound-upstream request-body hook. Off by default; experimental.
bound-upstream-request-body = ["praxis-filter/bound-upstream-request-body", "upstream-binding", "experimental"]
# The chain-binding registry extension API. Off by default; experimental.
chain-binding = ["praxis-filter/chain-binding", "experimental"]
# SPIFFE X.509-SVID mTLS peer identity. Off by default; experimental.
spiffe = ["praxis-protocol/spiffe", "praxis-filter/spiffe", "experimental"]
# Hedged requests. Off by default; experimental.
hedged-requests = ["praxis-protocol/hedged-requests", "experimental"]
# The `access_log` syslog sink (RFC 3164 over unix/UDP/TCP). Off by default;
# experimental. Pulls in the `syslog` crate, kept out of the default/FIPS builds.
access-log-syslog = ["praxis-filter/access-log-syslog", "experimental"]
# The `policy` filter (Praxis Policy Engine). `policy-builtins`, on by
# default, is the standard bundle: every builtin, the RustCrypto backend and
# the experimental rate limiter. A narrower build names `policy-engine` or
# individual `policy-*` builtins plus exactly one shared crypto backend
# (`policy-crypto-default` or `policy-crypto-fips`); the engine refuses to
# compile with neither or both. `policy-api-key-fips` and `policy-jwt-fips`
# are convenience aliases that add the FIPS backend.
policy-engine = ["praxis-filter/policy-engine", "praxis-protocol/policy-engine"]
policy-builtins = [
    "policy-engine",
    "policy-experimental-ratelimit",
    "praxis-filter/policy-builtins",
    "praxis-protocol/policy-builtins",
]
policy-jwt = ["policy-engine", "praxis-filter/policy-jwt", "praxis-protocol/policy-jwt"]
policy-jwt-openssl-fips = ["policy-engine", "praxis-filter/policy-jwt-openssl-fips", "praxis-protocol/policy-jwt-openssl-fips"]
policy-jwt-fips = ["policy-jwt-openssl-fips", "policy-crypto-fips"]
policy-api-key = ["policy-engine", "praxis-filter/policy-api-key", "praxis-protocol/policy-api-key"]
policy-crypto-default = ["policy-engine", "praxis-filter/policy-crypto-default", "praxis-protocol/policy-crypto-default"]
policy-crypto-fips = ["policy-engine", "praxis-filter/policy-crypto-fips", "praxis-protocol/policy-crypto-fips"]
policy-api-key-fips = ["policy-api-key", "policy-crypto-fips"]
policy-oauth = ["policy-engine", "praxis-filter/policy-oauth", "praxis-protocol/policy-oauth"]
policy-delegator-vault = ["policy-engine", "praxis-filter/policy-delegator-vault", "praxis-protocol/policy-delegator-vault"]
policy-elicitation-ciba = ["policy-engine", "praxis-filter/policy-elicitation-ciba", "praxis-protocol/policy-elicitation-ciba"]
policy-cedar = ["policy-engine", "praxis-filter/policy-cedar", "praxis-protocol/policy-cedar"]
policy-cel = ["policy-engine", "praxis-filter/policy-cel", "praxis-protocol/policy-cel"]
policy-opa = ["policy-engine", "praxis-filter/policy-opa", "praxis-protocol/policy-opa"]
policy-valkey = ["policy-engine", "praxis-filter/policy-valkey", "praxis-protocol/policy-valkey"]
policy-secrets-vault = ["policy-engine", "praxis-filter/policy-secrets-vault", "praxis-protocol/policy-secrets-vault"]
# PPE's embedded request rate limiter, in the default bundle through
# `policy-builtins`. Experimental.
policy-experimental-ratelimit = [
    "policy-engine",
    "praxis-filter/policy-experimental-ratelimit",
    "praxis-protocol/policy-experimental-ratelimit",
    "experimental",
]
# Marker feature activated transitively by any experimental feature.
# Used to gate the startup warning in startup_checks::warn_experimental_features.
experimental = []
otel = ["praxis-core/otel", "praxis-filter/otel", "praxis-protocol/otel"]
