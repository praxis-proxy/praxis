[package]
name = "praxis-proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Cloud-native proxy server"
license.workspace = true
repository.workspace = true
readme = "../../README.md"

[lib]
name = "praxis"
path = "src/lib.rs"

[[bin]]
name = "praxis"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { workspace = true }
notify = { workspace = true, optional = true }
praxis-core = { workspace = true }
praxis-filter = { workspace = true }
praxis-protocol = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "fs"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }
tikv-jemallocator = { workspace = true }

[build-dependencies]
cargo_metadata = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = ["config-reload", "admin-api"]
# Config-file and TLS certificate hot-reload (filesystem watching via
# `notify`). On by default; disable for a leaner build that drops the
# watchers and the `notify`/`arc-swap`/`tokio` deps they pull into tls.
config-reload = ["dep:notify", "praxis-protocol/config-reload"]
# Admin HTTP surface (management API, Prometheus /metrics, /healthy, /ready).
# On by default; the endpoints still only bind when `admin.address` is set.
# Disable for a build with no external observability/admin surface.
admin-api = ["praxis-protocol/admin-api"]
dev = ["basic-auth-filter"]
basic-auth-filter = ["praxis-filter/basic-auth-filter", "experimental"]
policy-engine = ["praxis-filter/policy-engine"]
# Marker feature activated transitively by any experimental feature.
# Used to gate the startup warning in startup_checks::warn_experimental_features.
experimental = []
otel = ["praxis-core/otel", "praxis-filter/otel"]
