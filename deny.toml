# Only the platforms praxis builds for, so Windows-only crates don't show up
# as duplicates or need license review.
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "aarch64-apple-darwin",
]

[advisories]
unmaintained = "all"
unsound = "all"
maximum-db-staleness = "P30D"
ignore = [
    # rustls-pemfile 2.2.0: unmaintained, pulled in by the pingora fork
    # (quixotic-plecostomus-rustls) and rustls-native-certs 0.7. Drop once
    # the fork parses PEM with rustls-pki-types instead.
    "RUSTSEC-2025-0134",

    # zstd 0.13.3 / zstd-safe 7.3.0: pulled transitively by the pingora fork
    # (quixotic-plecostomus-header-serde 0.11.1). The vulnerable APIs
    # (seekable decompression, dictionary training, try_clone, streaming
    # legacy frames) are not exercised by Pingora's header serialization
    # path. Drop once the fork bumps to zstd >= 0.14.3 / zstd-safe >= 8.2.0.
    "RUSTSEC-2026-0391",  # zstd: abandoned stream data leaks
    "RUSTSEC-2026-0395",  # zstd-safe: use-after-free with StableInBuffer
    "RUSTSEC-2026-0396",  # zstd-safe: Seekable reads NULL seek table
    "RUSTSEC-2026-0397",  # zstd-safe: OutBuffer::around_pos uninitialized memory
    "RUSTSEC-2026-0398",  # zstd-safe: Seekable::decompress beyond capacity
    "RUSTSEC-2026-0399",  # zstd-safe: use-after-free via init_using_cdict/ddict
    "RUSTSEC-2026-0400",  # zstd-safe: use-after-free after one-shot with open stream
    "RUSTSEC-2026-0401",  # zstd-safe: OOB read in train_from_buffer
    "RUSTSEC-2026-0402",  # zstd-safe: heap overflow in CCtx::try_clone
    "RUSTSEC-2026-0403",  # zstd-safe: uninitialized memory on legacy frame failure
    "RUSTSEC-2026-0404",  # zstd-safe: double free in DCtx::try_clone
    "RUSTSEC-2026-0405",  # zstd-safe: OOB read with out-of-range InBuffer::pos
    "RUSTSEC-2026-0406",  # zstd-safe: use-after-free on multithreaded context
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

# The remaining duplicate versions are transitive and known-unfixable:
# the Pingora fork's large subtree pulls its own versions of some common
# crates (syn, hashbrown, getrandom, ...) that differ from praxis's other
# transitive deps. Suppress the whole fork subtree rather than tracking
# each ecosystem-wide duplicate. No version on the crate, so a fork bump
# cannot silently unmatch it. Re-evaluate on each Pingora fork sync.
skip-tree = [
    { crate = "quixotic-plecostomus-core", reason = "pingora fork transitive subtree pulls older shared crates than praxis" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
