# Only the platforms praxis builds for, so Windows-only crates don't show up
# as duplicates or need license review.
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "aarch64-apple-darwin",
]

[advisories]
unmaintained = "all"
unsound = "all"
maximum-db-staleness = "P30D"
ignore = [
    # rustls-pemfile 2.2.0: unmaintained, pulled in by the pingora fork
    # (quixotic-plecostomus-rustls) and rustls-native-certs 0.7. Drop once
    # the fork parses PEM with rustls-pki-types instead.
    "RUSTSEC-2025-0134",
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

# The remaining duplicate versions are transitive and known-unfixable:
# the Pingora fork's large subtree pulls its own versions of some common
# crates (syn, hashbrown, getrandom, ...) that differ from praxis's other
# transitive deps. Suppress the whole fork subtree rather than tracking
# each ecosystem-wide duplicate. No version on the crate, so a fork bump
# cannot silently unmatch it. Re-evaluate on each Pingora fork sync.
skip-tree = [
    { crate = "quixotic-plecostomus-core", reason = "pingora fork transitive subtree pulls older shared crates than praxis" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
