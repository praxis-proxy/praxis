[advisories]
unmaintained = "all"
maximum-db-staleness = "P30D"
ignore = [
    # rustls-pemfile 2.2.0: unmaintained (transitive via pingora fork)
    "RUSTSEC-2025-0134",
    # NOTE: the unsound `lru` advisory RUSTSEC-2026-0253 is not listed
    # here: `unmaintained = "all"` does not gate `unsound` advisories,
    # so cargo-deny never flags it and an ignore would be unused. It is
    # ignored in .cargo/audit.toml, where cargo-audit does warn on it.
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

# The remaining duplicate versions are transitive and known-unfixable:
# the Pingora fork's large subtree pulls its own versions of some common
# crates (syn, hashbrown, getrandom, ...) that differ from praxis's other
# transitive deps. Suppress the whole fork subtree rather than tracking
# each ecosystem-wide duplicate. Re-evaluate on each Pingora fork sync.
skip-tree = [
    { crate = "quixotic-plecostomus-core@0.8", reason = "pingora fork transitive subtree pulls older shared crates than praxis" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Temporary: see the praxis-policy patch in Cargo.toml.
allow-git = ["https://github.com/araujof/praxis-policy"]
