name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug", "triage/needs-triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal Reproduction
      description: Smallest steps that trigger the bug
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Minimal config that reproduces the bug. Scrub secrets before pasting.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output. Scrub secrets, tokens, and private data before pasting.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Praxis Version
      placeholder: "v0.4.0"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - AI / Inference
        - Core / Config
        - Filter Pipeline
        - Observability
        - Protocol
        - Security / TLS
        - Traffic Management
        - Transformation
        - Other
