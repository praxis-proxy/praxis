name: FIPS

# ------------------------------------------------------------------------------
# Workflow Settings
# ------------------------------------------------------------------------------
#
# Two jobs. `ubi-image` is the static proof, on GitHub's runners: the FIPS
# build on UBI 9, checked the way Red Hat checks it, first the compliance
# report (a reason and a pointer for every finding), then Red Hat's own
# scanner, openshift/check-payload at its Rust-support revision, against the
# runtime image with warnings fatal. It runs on every pull request and push to
# main so a change that breaks FIPS compliance never reaches a release.
#
# `fips-host` is the runtime proof, on the self-hosted runner that is a RHEL 9
# host in FIPS mode (labels `fips` and `rhel`): the image `ubi-image` built and
# scanned, handed over as an artifact and checked by id, is attested, the
# whole test suite runs as the FIPS build inside the UBI 9 toolchain image on
# that host, and the image is run under PRAXIS_REQUIRE_FIPS=1 and probed from
# outside. A self-hosted runner must never run a fork's code, so on pull
# requests it runs only for same-repository branches; it also runs on every
# push to main, nightly, and on dispatch.
#
# Everything runs through the Makefile targets developers use locally (see
# docs/developing/fips.md), with podman: Red Hat's image signatures can only
# be verified with podman, and the scanner reads podman's image store.
# Ubuntu's podman packaging ships no registries.d entry for Red Hat's
# registry, so the hosted job first tells podman where the signatures live
# (make fips-signature-store), as a developer on Debian or Ubuntu would.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly runtime proof; clear of the other nightly schedules.
    - cron: "41 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  # ----------------------------------------------------------------------------
  # UBI 9 image: compliance report, then Red Hat's scanner
  # ----------------------------------------------------------------------------

  ubi-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      image-id: ${{ steps.save.outputs.image-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@f636950733882cf65b15cdc3efab570158feea4a # v0.1.0
        with:
          # Only xtask (without its default features) is built on the host;
          # keep that off the shared cache key and skip caching its target.
          cache-suffix: fips
          cache-target: "false"

      - name: Set up Go (builds Red Hat's scanner)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          # The scanner is fetched by make fips-scanner and vendors its modules.
          cache: false

      - name: Build Red Hat's scanner (check-payload) at the pinned revision
        run: make fips-scanner

      - name: Install the OpenShift CLI (check-payload refuses to scan without oc)
        env:
          # A fixed release from Red Hat's mirror; the digest is the one in that
          # release's sha256sum.txt, which is signed with Red Hat's release key 2.
          OC_URL: https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/4.21.33/openshift-client-linux-amd64-rhel9-4.21.33.tar.gz
          OC_SHA256: 59b83765c889d9ae8b05ead5e2a4559d913bb24fd9065ab3c08279317da52f67
        run: |
          mkdir -p "$RUNNER_TEMP/oc"
          curl -sSfL -o "$RUNNER_TEMP/oc.tar.gz" "$OC_URL"
          echo "$OC_SHA256  $RUNNER_TEMP/oc.tar.gz" | sha256sum -c
          tar xzf "$RUNNER_TEMP/oc.tar.gz" -C "$RUNNER_TEMP/oc" oc
          echo "$RUNNER_TEMP/oc" >> "$GITHUB_PATH"

      - name: Point podman at Red Hat's signature store (Ubuntu's podman has no entry for it)
        run: make fips-signature-store

      - name: Verify the Red Hat base images are signed by Red Hat
        run: make fips-verify-image

      - name: Build on UBI 9 with Red Hat's toolchain and print the compliance report
        run: make fips-check

      - name: Build the FIPS runtime image
        run: make container-fips

      - name: Run the image once (validates its config with the system OpenSSL)
        run: make fips-smoke

      - name: Scan the image with check-payload (warnings fatal)
        run: make fips-scan

      # The runner job tests this exact image, not a rebuild: hand it over as
      # an archive, with its id recorded here so the other job can check it.
      - name: Save the image for the FIPS runner
        id: save
        run: |
          make fips-image-save
          echo "image-id=$(cat target/fips/praxis-fips-image.tar.id)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fips-image
          path: |
            target/fips/praxis-fips-image.tar
            target/fips/praxis-fips-image.tar.id
          if-no-files-found: error
          retention-days: 3

  # ----------------------------------------------------------------------------
  # FIPS host: the runtime proof, on the RHEL 9 runner in FIPS mode
  # ----------------------------------------------------------------------------

  fips-host:
    needs: ubi-image
    # Never a fork's code on the self-hosted runner: pull requests only from
    # this repository's own branches.
    if: >-
      needs.ubi-image.result == 'success'
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, fips, rhel]
    # One runner: queue behind any other run rather than share it.
    concurrency:
      group: fips-host-runner
      cancel-in-progress: false
    # Building the suites in the toolchain image from a cold cache dominates.
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/fips-runner-check

      # The self-hosted RHEL runner is persistent, so podman state from earlier
      # runs piles up on the same disk as the checkout, the fetched image
      # tarball and the build-cache volumes, and a cold suite build can run it
      # to zero mid-build (No space left on device; dnf in fips-toolchain short
      # by hundreds of MB). Reclaim in three passes, BEFORE the image is fetched
      # and loaded so nothing here touches the image this run proves:
      #   1. Force-remove stale containers still bound to the dedicated FIPS
      #      cache volumes. test-fips-host runs the toolchain container with
      #      --rm, but a crashed or SIGKILLed run leaves it behind, still marked
      #      running and still holding praxis-fips-host-{target,cargo}. A volume
      #      a container still references is never pruned, so a single leftover
      #      container defeats passes 2 and 3 entirely: the #1290 cleanup runs
      #      but frees nothing and the disk stays full. The fips-host-runner
      #      concurrency group (cancel-in-progress: false) serialises runs on
      #      this one runner, so no other legitimate run can be holding these
      #      volumes while we execute; any container bound to them now is a
      #      leftover and safe to force-remove. Scoped to those two volumes by
      #      name so nothing else on the runner is touched, and deliberately NOT
      #      guarded with `|| true`: if a stale container cannot be removed the
      #      volume stays pinned and the build hits the same wall, so fail
      #      loudly instead of hiding it.
      #   2. podman system prune -a removes every stale image and the build
      #      cache. A prune without -a is near-useless here (that space is in
      #      tagged images from prior runs, not dangling layers).
      #   3. The volumes, not the images, dominate this disk. podman volume
      #      prune removes only volumes no container references, so a cache in
      #      use is left alone; the praxis-fips-host-cargo / -target caches idle
      #      between runs (or freed by pass 1) may be dropped and rebuilt within
      #      the 180-minute budget. Correctness over cache warmth: without this
      #      the disk stays full and the toolchain build fails outright.
      # df -h and podman ps/system df either side make a future exhaustion, and
      # which containers and volumes hold the space, visible in the log.
      - name: Reclaim disk before loading the image (remove stale FIPS cache containers, then prune images + unused volumes)
        run: |
          set -euo pipefail

          echo "== Container and disk state before cleanup =="
          df -h "$GITHUB_WORKSPACE" || df -h || true
          podman ps -a || true
          podman system df -v || podman system df || true

          # Pass 1: force-remove leftover containers pinning the FIPS cache
          # volumes. Safe because fips-host-runner serialises runs on this
          # single runner (see the note above). No `|| true`: a failure here
          # means the volume stays pinned, so let the step fail.
          for volume in praxis-fips-host-target praxis-fips-host-cargo; do
            stale="$(podman ps -aq --filter "volume=$volume")"
            if [ -n "$stale" ]; then
              echo "Force-removing stale container(s) pinning volume $volume:"
              echo "$stale"
              # Word-splitting is intended: $stale may hold several ids.
              # shellcheck disable=SC2086
              podman rm --force --time 0 $stale
            fi
          done

          # Pass 2 + 3: the existing image and unused-volume prune, which can
          # now reclaim any FIPS cache volume freed by pass 1.
          podman system prune -a --force || true
          podman volume prune --force || true

          echo "== Container and disk state after cleanup =="
          podman ps -a || true
          podman system df || true
          df -h "$GITHUB_WORKSPACE" || df -h || true

      - name: Fetch the image the hosted job built and scanned
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fips-image
          path: target/fips

      - name: Load it and check it is that image
        env:
          EXPECTED_ID: ${{ needs.ubi-image.outputs.image-id }}
        run: |
          make fips-image-load
          [ "$(cat target/fips/praxis-fips-image.tar.id)" = "$EXPECTED_ID" ] \
            || { echo "::error::the archive's image id does not match the one the hosted job recorded"; exit 1; }

      - uses: ./.github/actions/fips-host
        with:
          run-suites: "true"

      - name: Remove the loaded image
        if: always()
        run: podman rmi --force "localhost/praxis:$(make -s fips-version)-fips" || true
