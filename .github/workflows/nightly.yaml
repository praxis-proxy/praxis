name: Nightly

# ------------------------------------------------------------------------------
# Workflow Settings
# ------------------------------------------------------------------------------

on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ----------------------------------------------------------------------------
  # Lint (fmt + clippy + dependency lint)
  # ----------------------------------------------------------------------------

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust (stable + nightly fmt)
        uses: praxis-proxy/conventions/.github/actions/setup-rust-lint@f636950733882cf65b15cdc3efab570158feea4a # v0.1.0

      - name: Install cargo-machete
        run: cargo install cargo-machete --locked

      - name: Lint
        run: make lint

  # ----------------------------------------------------------------------------
  # Documentation
  # ----------------------------------------------------------------------------

  doc:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@f636950733882cf65b15cdc3efab570158feea4a # v0.1.0
        with:
          cache-suffix: doc

      - name: Build documentation
        run: make doc

  # ----------------------------------------------------------------------------
  # Unit tests
  # ----------------------------------------------------------------------------

  test-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@f636950733882cf65b15cdc3efab570158feea4a # v0.1.0

      - name: Unit tests
        run: make test-unit

  # ----------------------------------------------------------------------------
  # Integration tests
  # ----------------------------------------------------------------------------

  test-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@f636950733882cf65b15cdc3efab570158feea4a # v0.1.0

      - name: Integration tests
        run: make test-integration

  # ----------------------------------------------------------------------------
  # Conformance tests
  # ----------------------------------------------------------------------------

  test-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@f636950733882cf65b15cdc3efab570158feea4a # v0.1.0

      - name: Install Tools
        run: make target/praxis-binutils/h2spec

      - name: Conformance tests
        run: make test-conformance

  # ----------------------------------------------------------------------------
  # Supply chain audit
  # ----------------------------------------------------------------------------

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Supply chain audit
        uses: praxis-proxy/conventions/.github/actions/supply-chain-audit@f636950733882cf65b15cdc3efab570158feea4a # v0.1.0

  # ----------------------------------------------------------------------------
  # Coverage gate
  # ----------------------------------------------------------------------------

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check coverage
        uses: praxis-proxy/conventions/.github/actions/coverage-check@f636950733882cf65b15cdc3efab570158feea4a # v0.1.0

  # ----------------------------------------------------------------------------
  # Beta/Nightly canary
  # ----------------------------------------------------------------------------

  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        toolchain: [beta, nightly]
    continue-on-error: ${{ matrix.toolchain == 'nightly' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ${{ matrix.toolchain }} toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Install h2spec
        run: make target/praxis-binutils/h2spec

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Run tests
        run: |
          export PATH="$(pwd)/target/praxis-binutils:$PATH"
          cargo test --workspace

  # ----------------------------------------------------------------------------
  # Nightly container image (published to GHCR)
  #
  # Publishes a rolling `nightly` tag plus a dated `nightly-YYYYMMDD` tag and a
  # commit-sha tag, but only once the functional test suites are green, and
  # the same three tags with a `-fips` suffix for the FIPS image. This
  # publishes the container images only; crates are never published from here.
  # ----------------------------------------------------------------------------

  container:
    needs: [test-unit, test-integration, test-conformance]
    runs-on: ubuntu-24.04
    # Two images; the FIPS one is a from-scratch LTO release build on UBI 9.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The FIPS image (Containerfile.fips, UBI 9) ships next to the standard
      # one under the same tags with a -fips suffix, after its pinned Red Hat
      # base images are verified to be signed by Red Hat.
      - name: Set up Rust (for the Red Hat image verification)
        uses: praxis-proxy/conventions/.github/actions/setup-rust@f636950733882cf65b15cdc3efab570158feea4a # v0.1.0
        with:
          # The restored target/ would otherwise be swept into the build context.
          cache-target: "false"

      - name: Point podman at Red Hat's signature store (Ubuntu's podman has no entry for it)
        run: make fips-signature-store

      - name: Verify the Red Hat base images are signed by Red Hat
        run: make fips-verify-image

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=nightly
            type=schedule,pattern=nightly-{{date 'YYYYMMDD'}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract FIPS image metadata
        id: meta-fips
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=-fips
          tags: |
            type=raw,value=nightly
            type=schedule,pattern=nightly-{{date 'YYYYMMDD'}}
            type=sha

      - name: Build and push the FIPS image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile.fips
          target: runtime
          push: true
          tags: ${{ steps.meta-fips.outputs.tags }}
          labels: ${{ steps.meta-fips.outputs.labels }}
          cache-from: type=gha,scope=fips
          cache-to: type=gha,mode=min,scope=fips
