name: Issue Triage

# ------------------------------------------------------------------------------
# Workflow Settings
# ------------------------------------------------------------------------------
#
# Shared from praxis-proxy/conventions (issue-triage.yaml). Reviewers triage
# here too, so core-reviewers counts as a maintainer team.

on:
  issues:
    types: [opened, assigned, milestoned]

permissions: {}

jobs:
  triage:
    permissions:
      issues: write
    uses: praxis-proxy/conventions/.github/workflows/issue-triage.yaml@c5837c3fdd35066b05d337594fabe9d641d08df2 # v0.3.0
    with:
      maintainer-teams: project-leadership,core-maintainers,core-reviewers
      policy-doc: docs/developing/project-management.md#triage
    secrets:
      PRAXIS_BOT_APP_ID: ${{ secrets.PRAXIS_BOT_APP_ID }}
      PRAXIS_BOT_APP_PRIVATE_KEY: ${{ secrets.PRAXIS_BOT_APP_PRIVATE_KEY }}
