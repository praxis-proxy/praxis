name: Issue Triage

# ------------------------------------------------------------------------------
# Workflow Settings
# ------------------------------------------------------------------------------
#
# Flags new issues for triage and unassigns anyone put on an issue that hasn't
# been triaged yet (it needs a milestone and a project board), shared from
# praxis-proxy/conventions (issue-triage.yaml). The bot's comment links to the
# Triage section of docs/developing/project-management.md.
#
# The called job does everything with the praxis-bot app token, so this job
# grants no GITHUB_TOKEN permissions.
#
# No conventions release has this version of the workflow yet, so the pin is
# an untagged commit after v0.3.0. Dependabot reads versions from tags, not
# comments: until this moves to a tag it tracks the conventions main branch and
# leaves the comment as is.

on:
  issues:
    types: [opened, assigned, milestoned]

permissions: {}

jobs:
  triage:
    uses: praxis-proxy/conventions/.github/workflows/issue-triage.yaml@26a77b507a24b98f2cd653a463e797e17da985e4 # unreleased, after v0.3.0
    with:
      policy-doc: docs/developing/project-management.md#triage
    secrets:
      PRAXIS_BOT_APP_ID: ${{ secrets.PRAXIS_BOT_APP_ID }}
      PRAXIS_BOT_APP_PRIVATE_KEY: ${{ secrets.PRAXIS_BOT_APP_PRIVATE_KEY }}
