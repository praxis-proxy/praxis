name: Microbenchmarks

# ------------------------------------------------------------------------------
# Workflow Settings
# ------------------------------------------------------------------------------

on:
  schedule:
    - cron: "57 2 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  # ----------------------------------------------------------------------------
  # Microbenchmarks
  # ----------------------------------------------------------------------------

  microbenchmarks:
    name: microbenchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@c5837c3fdd35066b05d337594fabe9d641d08df2 # v0.3.0
        with:
          cache-suffix: bench

      - name: Run microbenchmarks
        run: cargo bench -p praxis-tests-benches

      - name: Upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: microbenchmark-results
          path: target/criterion/
