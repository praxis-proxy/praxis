name: Publish

# ------------------------------------------------------------------------------
# Workflow Settings
# ------------------------------------------------------------------------------

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  # ----------------------------------------------------------------------------
  # Container Build & Publish
  # ----------------------------------------------------------------------------

  container:
    runs-on: ubuntu-24.04
    # Two images; the FIPS one is a from-scratch LTO release build on UBI 9.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The FIPS image (Containerfile.fips, UBI 9) ships next to the standard
      # one under the same tags with a -fips suffix, after its pinned Red Hat
      # base images are verified to be signed by Red Hat.
      - name: Set up Rust (for the Red Hat image verification)
        uses: praxis-proxy/conventions/.github/actions/setup-rust@f636950733882cf65b15cdc3efab570158feea4a # v0.1.0
        with:
          # The restored target/ would otherwise be swept into the build context.
          cache-target: "false"

      - name: Verify the Red Hat base images are signed by Red Hat
        run: make fips-verify-image

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Manual, out-of-band builds only get ref-identifying tags: the immutable
      # :sha-<hash> plus the branch name. The consumer-facing moving tags
      # (:latest and :<major>.<minor>) are advanced only by the release
      # pipeline, so a manual dispatch from any ref cannot repoint consumers.
      # A tag dispatch produces only :sha-<hash> (there is no branch to name).
      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=sha
            type=ref,event=branch

      - name: Build and push container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Derive FIPS image metadata
        id: meta-fips
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=-fips
          tags: |
            type=sha
            type=ref,event=branch

      - name: Build and push the FIPS container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Containerfile.fips
          target: runtime
          push: true
          tags: ${{ steps.meta-fips.outputs.tags }}
          labels: ${{ steps.meta-fips.outputs.labels }}
          cache-from: type=gha,scope=fips
          cache-to: type=gha,mode=min,scope=fips
