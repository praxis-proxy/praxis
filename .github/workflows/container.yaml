name: Container

# ------------------------------------------------------------------------------
# Workflow Settings
# ------------------------------------------------------------------------------

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Containerfile
      - Cargo.toml
      - Cargo.lock
      - '**/Cargo.toml'

permissions: {}

jobs:
  # ----------------------------------------------------------------------------
  # Build & Run Container
  # ----------------------------------------------------------------------------

  build-and-run:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build container image
        run: docker build -t praxis:ci -f Containerfile .

      - name: Run container
        run: docker run -d --name praxis praxis:ci

      - name: Wait for healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' praxis 2>/dev/null || echo "starting")
            if [ "${status}" = "healthy" ]; then
              echo "Container is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Container failed to become healthy"
          docker inspect --format='{{json .State.Health}}' praxis
          docker logs praxis
          exit 1

      - name: Verify non-root user
        run: |
          user=$(docker exec praxis whoami)
          if [ "${user}" != "praxis" ]; then
            echo "Expected user 'praxis', got '${user}'"
            exit 1
          fi

      - name: Verify health endpoint
        run: |
          response=$(docker exec praxis curl -fsS http://127.0.0.1:9901/healthy)
          if [ "${response}" != '{"status":"ok"}' ]; then
            echo "Unexpected health response: ${response}"
            exit 1
          fi

      - name: Stop container
        if: always()
        run: docker rm -f praxis
