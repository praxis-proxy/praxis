name: Release

# ------------------------------------------------------------------------------
# Workflow Settings
# ------------------------------------------------------------------------------
#
# Tag-driven release pipeline in two phases:
#
#   Phase 1 (version tag push): validate the tag against the workspace
#   version, run the full test suite, verify the crates package cleanly with
#   a publish dry run, build and push the container image to GHCR, then cut a
#   DRAFT pre-release. The image ships at this stage so the release can
#   reference an image that already exists; the crates are only dry-run here.
#
#   Phase 2 (a maintainer publishes the draft): publishing the draft, whether
#   left as a pre-release or promoted to a full release, fires the
#   `release: published` event, which performs the real crates.io publish.
#   This requires the RUST_CRATES_PUBLISH_TOKEN secret.
#
# In other words, cutting the final release stays in human hands: the tag
# push prepares a reviewable draft (with the container image already
# published), and the crates reach crates.io only once a maintainer
# publishes the release.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ----------------------------------------------------------------------------
  # Phase 1 (tag push): validate the tag matches Cargo.toml
  # ----------------------------------------------------------------------------

  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${TAG#v}"
          CARGO_VERSION=$(perl -ne 'print $1 if /^version\s*=\s*"(.+)"/' Cargo.toml)
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match Cargo.toml ($CARGO_VERSION)"
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

  # ----------------------------------------------------------------------------
  # Phase 1 (tag push): skip the redundant test run when this commit is already
  # green
  #
  # The test suite is split on main across the "Tests", "Tests (Integration)",
  # and "Conformance" workflows. When all three already concluded successfully
  # for this exact commit, re-running them for the tag is pure duplication, so
  # the `test` job below is skipped. Otherwise it runs the unit, integration,
  # and conformance suites directly.
  # ----------------------------------------------------------------------------

  preflight:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      tests_already_green: ${{ steps.check.outputs.tests_already_green }}
    steps:
      - name: Check whether the required test workflows already passed for this commit
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          all_green=true
          for wf in "Tests" "Tests (Integration)" "Conformance"; do
            conclusion=$(gh run list --repo "$REPO" --workflow "$wf" --limit 100 \
              --json headSha,status,conclusion \
              --jq "[.[] | select(.headSha==\"$SHA\" and .status==\"completed\")][0].conclusion // \"none\"" \
              2>/dev/null) || conclusion="error"
            echo "workflow '$wf' @ $SHA -> ${conclusion:-none}"
            [ "$conclusion" = "success" ] || all_green=false
          done
          echo "tests_already_green=$all_green" >> "$GITHUB_OUTPUT"
          if [ "$all_green" = "true" ]; then
            echo "::notice::Required test workflows already passed for $SHA; skipping the tag test job."
          else
            echo "::notice::Test workflows not all green for $SHA; the tag test job will run."
          fi

  # ----------------------------------------------------------------------------
  # Phase 1 (tag push): run the full test suite (skipped when already green)
  # ----------------------------------------------------------------------------

  test:
    needs: [validate, preflight]
    # Skip only when the preflight positively confirmed the commit is already
    # green. If the check was inconclusive (lookup error or the preflight job
    # itself failing), fall back to running the tests so a draft is never cut on
    # an unverified commit.
    if: >-
      !cancelled()
      && github.event_name == 'push'
      && needs.validate.result == 'success'
      && needs.preflight.outputs.tests_already_green != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@bcfaea95ff4e6746587d54f6b6d6a62cfc5aa0e4 # v0.1.0

      - name: Install h2spec
        run: make target/praxis-binutils/h2spec

      - name: Run all tests
        run: |
          make test
          make test-integration
          make test-conformance

  # ----------------------------------------------------------------------------
  # Phase 1 (tag push): verify crates package cleanly (publish dry run)
  # ----------------------------------------------------------------------------

  publish-dry-run:
    if: github.event_name == 'push'
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@bcfaea95ff4e6746587d54f6b6d6a62cfc5aa0e4 # v0.1.0

      - name: Publish dry run
        run: make publish-dry-run

  # ----------------------------------------------------------------------------
  # Phase 1 (tag push): build and publish the container image to GHCR
  #
  # The image ships before the release is published so the release references
  # an image that already exists.
  # ----------------------------------------------------------------------------

  container:
    needs: [validate, test]
    if: >-
      github.event_name == 'push'
      && !cancelled()
      && needs.validate.result == 'success'
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.ref_name }}

      - name: Build and publish container
        uses: praxis-proxy/conventions/.github/actions/ghcr-publish@bcfaea95ff4e6746587d54f6b6d6a62cfc5aa0e4 # v0.1.0
        with:
          image-name: ${{ github.repository }}

  # ----------------------------------------------------------------------------
  # Phase 1 (tag push): cut the draft pre-release
  #
  # A maintainer must review and publish this draft to trigger Phase 2 (the
  # real crates.io publish).
  # ----------------------------------------------------------------------------

  draft-release:
    needs: [validate, test, publish-dry-run, container]
    if: >-
      github.event_name == 'push'
      && !cancelled()
      && needs.validate.result == 'success'
      && needs.publish-dry-run.result == 'success'
      && needs.container.result == 'success'
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create draft pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --generate-notes --prerelease --draft

  # ----------------------------------------------------------------------------
  # Phase 2 (release published): publish the crates to crates.io for real
  #
  # The dry run already ran in Phase 1; publishing the release performs the
  # actual crates.io publish. Requires the RUST_CRATES_PUBLISH_TOKEN secret.
  # ----------------------------------------------------------------------------

  crates-publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@bcfaea95ff4e6746587d54f6b6d6a62cfc5aa0e4 # v0.1.0

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.RUST_CRATES_PUBLISH_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::RUST_CRATES_PUBLISH_TOKEN is not set; cannot publish to crates.io"
            exit 1
          fi
          make publish
