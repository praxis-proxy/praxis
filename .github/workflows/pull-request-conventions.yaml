name: Pull Request Conventions

# ------------------------------------------------------------------------------
# Workflow Settings
# ------------------------------------------------------------------------------
#
# Converts PRs failing a required check to draft and closes inactive ones,
# shared from praxis-proxy/conventions (pr-housekeeping.yaml).

on:
  workflow_dispatch:

permissions: {}

jobs:
  housekeeping:
    permissions:
      checks: read
      issues: read
      pull-requests: write
    uses: praxis-proxy/conventions/.github/workflows/pr-housekeeping.yaml@c5837c3fdd35066b05d337594fabe9d641d08df2 # v0.3.0
    secrets:
      PRAXIS_BOT_APP_ID: ${{ secrets.PRAXIS_BOT_APP_ID }}
      PRAXIS_BOT_APP_PRIVATE_KEY: ${{ secrets.PRAXIS_BOT_APP_PRIVATE_KEY }}
