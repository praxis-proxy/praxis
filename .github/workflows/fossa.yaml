name: FOSSA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  analyze:
    # Fork and Dependabot pull requests do not receive the upload secret.
    if: >-
      github.actor != 'dependabot[bot]'
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@c5837c3fdd35066b05d337594fabe9d641d08df2 # v0.3.0
        with:
          cache-suffix: fossa
          cache-target: "false"

      - name: Resolve locked workspace dependencies
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Analyze and upload workspace dependencies
        uses: fossas/fossa-action@29693cc50323968e039056be419b32989fc5880c # v2.0.0
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
          pinned-cli-version: v3.20.5
          project: https://github.com/praxis-proxy/praxis
          branch: ${{ github.head_ref || github.ref_name }}
        env:
          # Metadata was fetched with --locked; analysis must not re-resolve it.
          CARGO_NET_OFFLINE: "true"
