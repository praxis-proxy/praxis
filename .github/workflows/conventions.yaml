name: Coding Conventions

# ------------------------------------------------------------------------------
# Workflow Settings
# ------------------------------------------------------------------------------
#
# The PR gates are shared from praxis-proxy/conventions (pr-conventions.yaml).
# This caller sets praxis's limits: a 500-line size cap, filter-name commit
# scopes such as fix(circuit_breaker), and DCO left to the DCO GitHub App.
# Every check goes through the GitHub API; PR code is never checked out.

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  conventions:
    permissions:
      contents: read
      pull-requests: write
    uses: praxis-proxy/conventions/.github/workflows/pr-conventions.yaml@c5837c3fdd35066b05d337594fabe9d641d08df2 # v0.3.0
    with:
      max-additions: 500
      conventions-doc: docs/developing/conventions.md
      commit-subject-pattern: '^(build|chore|ci|docs|feat|fix|perf|refactor|test)(\(.+\))?!?: .{1,72}$'
      commit-subject-max-length: 0
      dco-check: false
    secrets:
      PRAXIS_BOT_APP_ID: ${{ secrets.PRAXIS_BOT_APP_ID }}
      PRAXIS_BOT_APP_PRIVATE_KEY: ${{ secrets.PRAXIS_BOT_APP_PRIVATE_KEY }}
