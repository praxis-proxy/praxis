name: Publish Dry Run

# ------------------------------------------------------------------------------
# Workflow Settings
# ------------------------------------------------------------------------------
#
# Shared from praxis-proxy/conventions (publish-dry-run.yaml).
#
# On main the workspace version is already published, so a full verify would
# build dependent crates against the older published siblings and fail. Skip
# the per-crate build here; the release pipeline (which bumps the version
# first) runs the full verification.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  publish-dry-run:
    permissions:
      contents: read
    uses: praxis-proxy/conventions/.github/workflows/publish-dry-run.yaml@c5837c3fdd35066b05d337594fabe9d641d08df2 # v0.3.0
    with:
      make-args: PUBLISH_DRY_RUN_FLAGS=--no-verify
