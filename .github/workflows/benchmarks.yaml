name: Benchmarks

# ------------------------------------------------------------------------------
# Workflow Settings
# ------------------------------------------------------------------------------

on:
  schedule:
    - cron: "17 3 * * *" # 11:17 PM ET
  workflow_dispatch:
    inputs:
      threshold:
        description: "Regression threshold (fraction, e.g. 0.01 = 1%)"
        required: false
        type: string
        default: "0.1"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  THRESHOLD: ${{ inputs.threshold || '0.10' }}

jobs:
  # ----------------------------------------------------------------------------
  # Comparative Benchmarks (Praxis vs Envoy)
  # ----------------------------------------------------------------------------

  benchmark:
    runs-on: ubuntu-24.04
    # Envoy alone took about 90 minutes; with Praxis benchmarked as well the
    # run needs roughly twice that.
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@c5837c3fdd35066b05d337594fabe9d641d08df2 # v0.3.0
        with:
          cache-suffix: bench

      - name: Install benchmark tools
        run: |
          make tools
          echo "${{ github.workspace }}/target/praxis-binutils" >> "$GITHUB_PATH"

      - name: Download baseline
        id: baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # A run that detected a regression uploads no baseline on purpose, so
          # the newest successful run is not always the one to compare against.
          # Walk back through the recent successful runs to the newest that
          # still has a baseline artifact.
          artifact_id=""
          for run_id in $(gh api "repos/${REPO}/actions/workflows/benchmarks.yaml/runs?branch=main&status=success&per_page=20" \
              --jq '.workflow_runs[].id'); do
            artifact_id=$(gh api "repos/${REPO}/actions/runs/${run_id}/artifacts" \
              --jq '[.artifacts[] | select(.name == "benchmark-baseline" and .expired == false)][0].id // empty')
            if [ -n "$artifact_id" ]; then
              echo "comparing against the baseline from run ${run_id}"
              break
            fi
          done
          if [ -z "$artifact_id" ]; then
            echo "no earlier run has a baseline; this run's results become the baseline"
            echo "status=missing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh api "repos/${REPO}/actions/artifacts/${artifact_id}/zip" > baseline.zip
          unzip -o baseline.zip -d .
          mv benchmark-results.yaml baseline.yaml
          echo "status=ok" >> "$GITHUB_OUTPUT"

      - name: Run benchmarks
        env:
          THRESHOLD: ${{ env.THRESHOLD }}
        run: |
          cargo xtask benchmark \
            --proxy envoy \
            --threshold "$THRESHOLD" \
            --runs 5 \
            --duration 60 \
            --warmup 30 \
            --format yaml \
            --output benchmark-results.yaml

      - name: Compare against baseline
        id: compare
        if: steps.baseline.outputs.status == 'ok'
        continue-on-error: true
        env:
          THRESHOLD: ${{ env.THRESHOLD }}
        run: |
          cargo xtask benchmark compare \
            baseline.yaml benchmark-results.yaml \
            --threshold "$THRESHOLD" | tee compare-output.txt

      - name: Post comparison to job summary
        if: steps.compare.outcome != 'skipped'
        run: |
          {
            echo "## Benchmark Comparison"
            echo '```'
            cat compare-output.txt 2>/dev/null || echo "No comparison output"
            echo '```'
            if [ "${{ steps.compare.outcome }}" = "failure" ]; then
              echo ""
              echo "> **Warning**: Regression detected. Review results for CI noise vs genuine regression."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload baseline
        if: steps.compare.outcome != 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-baseline
          path: benchmark-results.yaml
          overwrite: true

      - name: Upload timestamped results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-${{ github.sha }}
          path: benchmark-results.yaml
