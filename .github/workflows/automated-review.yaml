# NOTE: Currently disabled pending infrastructure

name: Automated Review

# ------------------------------------------------------------------------------
# Workflow Settings
# ------------------------------------------------------------------------------
#
# Shared from praxis-proxy/conventions (automated-review.yaml). The review
# instructions stay here, in .github/prompts/automated-review.md.

on:
  # TODO: enable after infra setup is complete
  # pull_request_target:
  #   branches: [main]
  #   types: [opened, ready_for_review]
  # schedule:
  #   - cron: "23 */4 * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review (blank = all unreviewed)"
        required: false
        type: string
        default: ""
      model:
        description: "Model override (e.g. claude-opus-4-6)"
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: praxis-proxy/conventions/.github/workflows/automated-review.yaml@c5837c3fdd35066b05d337594fabe9d641d08df2 # v0.3.0
    with:
      pr_number: ${{ inputs.pr_number }}
      model: ${{ inputs.model }}
      cloud-ml-region: ${{ vars.CLOUD_ML_REGION }}
      gcp-project-id: ${{ vars.GCP_PROJECT_ID }}
    secrets:
      PRAXIS_BOT_APP_ID: ${{ secrets.PRAXIS_BOT_APP_ID }}
      PRAXIS_BOT_APP_PRIVATE_KEY: ${{ secrets.PRAXIS_BOT_APP_PRIVATE_KEY }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
