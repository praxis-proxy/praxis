version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    groups:
      # Group minor and patch bumps; let each major update land on its own so a
      # breaking bump never blocks the rest of the batch.
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    ignore:
      # The rust builder image tracks rust-toolchain.toml, not Dependabot, so
      # hold rust major/minor. Dependabot also cannot move the `-alpineX.Y`
      # suffix of a rust tag: when it bumps the runtime `alpine:` image, the
      # builder tags in Containerfile and Containerfile.test have to follow
      # by hand, and `make lint` fails until they do.
      - dependency-name: "rust"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
