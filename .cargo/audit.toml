# cargo-audit configuration
#
# Keep this list in step with the [advisories] ignore list in deny.toml.

[advisories]
ignore = [
    # rustls-pemfile 2.2.0: unmaintained, pulled in by the pingora fork
    # (quixotic-plecostomus-rustls) and rustls-native-certs 0.7. Drop once
    # the fork parses PEM with rustls-pki-types instead.
    "RUSTSEC-2025-0134",
    # paste 1.0.15: unmaintained proc-macro (compile time only), pulled in by
    # cel 0.12 through limitador in the Policy rate limiter. Drop once cel
    # moves off it.
    "RUSTSEC-2024-0436",
    # chrono 0.4.45: unmaintained, no patched release. Used directly for
    # timestamps and transitively by Policy, Pingora, and benchmarks. Remove
    # after direct users and upstream dependencies migrate to maintained crates.
    "RUSTSEC-2026-0543",
    # chrono-tz 0.10.4: unmaintained, no patched release. Policy's CEL and OPA
    # engines pull it in through cel and regorus. Remove after those upstream
    # dependencies migrate off chrono-tz.
    "RUSTSEC-2026-0555",
    # 2026-11-19: Policy's limitador and regorus pull in heapless 0.7.17 via
    # postcard. RustSec rates the IndexMap insertion bug as very unlikely to
    # be reachable in practice. Remove when Policy drops heapless < 0.9.4.
    # https://github.com/praxis-proxy/policy/issues/353
    "RUSTSEC-2026-0582",
]
