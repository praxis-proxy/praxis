# cargo-audit configuration
#
# Keep this list in step with the [advisories] ignore list in deny.toml.

[advisories]
ignore = [
    # rustls-pemfile 2.2.0: unmaintained, pulled in by the pingora fork
    # (quixotic-plecostomus-rustls) and rustls-native-certs 0.7. Drop once
    # the fork parses PEM with rustls-pki-types instead.
    "RUSTSEC-2025-0134",
    # paste 1.0.15: unmaintained proc-macro (compile time only), pulled in by
    # cel 0.12 through limitador in the Policy rate limiter. Drop once cel
    # moves off it.
    "RUSTSEC-2024-0436",
    # chrono 0.4.45: unmaintained, used directly and required by Pingora and
    # the policy engine. Drop once these users migrate to maintained time crates.
    "RUSTSEC-2026-0543",
    # chrono-tz 0.10.4: unmaintained, pulled in by CEL and Regorus in
    # praxis-policy-builtins. Drop once those dependencies migrate.
    "RUSTSEC-2026-0555",
]
