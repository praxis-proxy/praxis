[package]
name = "praxis-proxy-tls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "TLS configuration types and validation for Praxis"
license.workspace = true
repository.workspace = true
readme = "../README.md"
publish = true

[lib]
name = "praxis_tls"

[lints]
workspace = true

[features]
rustls = ["dep:rustls", "dep:rustls-pemfile"]
openssl = ["dep:openssl"]
hot-reload = ["dep:arc-swap", "dep:notify", "dep:tokio"]

[dependencies]
arc-swap = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
openssl = { version = "0.10", optional = true }
rustls = { workspace = true, optional = true }
rustls-pemfile = { workspace = true, optional = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt"], optional = true }
tracing = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
rcgen = { workspace = true }
serde_yaml = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
